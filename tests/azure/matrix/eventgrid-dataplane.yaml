# Microsoft.EventGrid.DataPlane: CloudEvents on a namespace topic (publish, then pull delivery:
# receive, acknowledge, release, reject, renew locks). az has no data-plane verbs for them, so
# `rest` calls the namespace's topic endpoint, a local host of the emulator. The namespace comes
# from the curated eventgrid extension.
provider: Microsoft.EventGrid.DataPlane
cases:
  - id: eventgrid-dp-publish
    operations: [Microsoft.EventGrid.DataPlane Microsoft.EventGrid.DataPlane PublishCloudEvent]
    setup:
      - group create --name {rg} --location {location}
      - eventgrid namespace create --name {name:egn} --resource-group {rg} --location {location}
      - eventgrid namespace topic create --namespace-name {name:egn} --resource-group {rg} --name orders
      - run: eventgrid namespace show --name {name:egn} --resource-group {rg} --query topicsConfiguration.hostname -o tsv
        capture: host
    command: >-
      rest --method post --url "https://{host}/topics/orders:publish?api-version=2023-06-01-preview"
      --resource https://eventgrid.azure.net --headers "Content-Type=application/cloudevents+json; charset=utf-8"
      --body '{"specversion": "1.0", "type": "l2.matrix", "source": "/l2/matrix", "id": "{uuid}", "data": {"n": 1}}'
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: eventgrid-dp-receive-acknowledge
    operations:
      [
        Microsoft.EventGrid.DataPlane Microsoft.EventGrid.DataPlane PublishCloudEvents,
        Microsoft.EventGrid.DataPlane Microsoft.EventGrid.DataPlane ReceiveCloudEvents,
        Microsoft.EventGrid.DataPlane Microsoft.EventGrid.DataPlane AcknowledgeCloudEvents,
      ]
    setup:
      - group create --name {rg} --location {location}
      - eventgrid namespace create --name {name:egn} --resource-group {rg} --location {location}
      - eventgrid namespace topic create --namespace-name {name:egn} --resource-group {rg} --name orders
      - >-
        eventgrid namespace topic event-subscription create --namespace-name {name:egn} --resource-group {rg}
        --topic-name orders --name workers --delivery-configuration "{deliveryMode:Queue,queue:{receiveLockDurationInSeconds:60}}"
      - run: eventgrid namespace show --name {name:egn} --resource-group {rg} --query topicsConfiguration.hostname -o tsv
        capture: host
      - >-
        rest --method post --url "https://{host}/topics/orders:publish?api-version=2023-06-01-preview"
        --resource https://eventgrid.azure.net --headers "Content-Type=application/cloudevents-batch+json; charset=utf-8"
        --body '[{"specversion": "1.0", "type": "l2.matrix", "source": "/l2/matrix", "id": "{uuid}", "data": {"n": 1}}]'
      - run: >-
          rest --method post
          --url "https://{host}/topics/orders/eventsubscriptions/workers:receive?api-version=2023-06-01-preview&maxEvents=1&maxWaitTime=10"
          --resource https://eventgrid.azure.net
        until: { json: { path: "value[0].event.id", equals: "{uuid}" } }
        capture: { lock: "value[0].brokerProperties.lockToken" }
    command: >-
      rest --method post
      --url "https://{host}/topics/orders/eventsubscriptions/workers:acknowledge?api-version=2023-06-01-preview"
      --resource https://eventgrid.azure.net --body '{"lockTokens": ["{lock}"]}'
    expect:
      json: { path: "succeededLockTokens[0]", equals: "{lock}" }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: eventgrid-dp-release-renew-reject
    operations:
      [
        Microsoft.EventGrid.DataPlane Microsoft.EventGrid.DataPlane RenewCloudEventLocks,
        Microsoft.EventGrid.DataPlane Microsoft.EventGrid.DataPlane ReleaseCloudEvents,
        Microsoft.EventGrid.DataPlane Microsoft.EventGrid.DataPlane RejectCloudEvents,
      ]
    setup:
      - group create --name {rg} --location {location}
      - eventgrid namespace create --name {name:egn} --resource-group {rg} --location {location}
      - eventgrid namespace topic create --namespace-name {name:egn} --resource-group {rg} --name orders
      - >-
        eventgrid namespace topic event-subscription create --namespace-name {name:egn} --resource-group {rg}
        --topic-name orders --name workers --delivery-configuration "{deliveryMode:Queue,queue:{receiveLockDurationInSeconds:60}}"
      - run: eventgrid namespace show --name {name:egn} --resource-group {rg} --query topicsConfiguration.hostname -o tsv
        capture: host
      - >-
        rest --method post --url "https://{host}/topics/orders:publish?api-version=2023-06-01-preview"
        --resource https://eventgrid.azure.net --headers "Content-Type=application/cloudevents+json; charset=utf-8"
        --body '{"specversion": "1.0", "type": "l2.matrix", "source": "/l2/matrix", "id": "{uuid}", "data": {"n": 2}}'
      - run: >-
          rest --method post
          --url "https://{host}/topics/orders/eventsubscriptions/workers:receive?api-version=2023-06-01-preview&maxEvents=1&maxWaitTime=10"
          --resource https://eventgrid.azure.net
        until: { json: { path: "value[0].event.id", equals: "{uuid}" } }
        capture: { lock: "value[0].brokerProperties.lockToken" }
      - >-
        rest --method post
        --url "https://{host}/topics/orders/eventsubscriptions/workers:renewLock?api-version=2023-10-01-preview"
        --resource https://eventgrid.azure.net --body '{"lockTokens": ["{lock}"]}'
      - >-
        rest --method post
        --url "https://{host}/topics/orders/eventsubscriptions/workers:release?api-version=2023-06-01-preview"
        --resource https://eventgrid.azure.net --body '{"lockTokens": ["{lock}"]}'
      - run: >-
          rest --method post
          --url "https://{host}/topics/orders/eventsubscriptions/workers:receive?api-version=2023-06-01-preview&maxEvents=1&maxWaitTime=10"
          --resource https://eventgrid.azure.net
        until: { json: { path: "value[0].event.id", equals: "{uuid}" } }
        capture: { lock2: "value[0].brokerProperties.lockToken" }
    command: >-
      rest --method post
      --url "https://{host}/topics/orders/eventsubscriptions/workers:reject?api-version=2023-06-01-preview"
      --resource https://eventgrid.azure.net --body '{"lockTokens": ["{lock2}"]}'
    expect:
      json: { path: "succeededLockTokens[0]", equals: "{lock2}" }
    cleanup:
      - group delete --name {rg} --yes --no-wait
