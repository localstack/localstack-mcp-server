# Microsoft.Sql: logical servers, databases, elastic pools, firewall and network rules, security
# and auditing policies, keys, AD administrators. A server runs a real MSSQL container, so every
# case is `backing: true` (CI sets MSSQL_ACCEPT_EULA=Y on the emulator).
# The table and column reads are a known gap only because no table can be created; the elastic
# pool and data warehouse families are known gaps because no pool or DW can be created.
provider: Microsoft.Sql
cases:
  - id: sql-server
    operations:
      [
        Microsoft.Sql Servers CreateOrUpdate,
        Microsoft.Sql Servers Get,
        Microsoft.Sql Servers ListByResourceGroup,
        Microsoft.Sql Servers List,
        Microsoft.Sql Servers Update,
        Microsoft.Sql Servers CheckNameAvailability,
        Microsoft.Sql ElasticPools ListByServer,
      ]
    backing: true
    note: >-
      Samples sql server create/show. The (empty) pool list is here because no pool can be
      created (see sql-elastic-pool).
    setup:
      - group create --name {rg} --location {location}
      - >-
        sql server create --name {name:sql} --resource-group {rg} --location {location}
        --admin-user sqladmin --admin-password LocalStack123!
      - run: sql server show --name {name:sql} --resource-group {rg} --query state -o tsv
        until: { stdout: { equals: Ready } }
      - sql server list --resource-group {rg}
      - sql server list --query "[?name=='{name:sql}'].name"
      - sql elastic-pool list --server {name:sql} --resource-group {rg}
      - run: sql server update --name {name:sql} --resource-group {rg} --minimal-tls-version 1.2
        until: { json: { path: minimalTlsVersion, equals: "1.2" } }
    command: >-
      rest --method post --url /subscriptions/{sub}/providers/Microsoft.Sql/checkNameAvailability?api-version=2023-05-01-preview
      --body '{"name": "{name:sql}", "type": "Microsoft.Sql/servers"}'
    expect:
      json: { path: available, equals: false }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: sql-firewall-vnet-rules
    operations:
      [
        Microsoft.Sql FirewallRules CreateOrUpdate,
        Microsoft.Sql FirewallRules Get,
        Microsoft.Sql FirewallRules ListByServer,
        Microsoft.Sql FirewallRules Delete,
        Microsoft.Sql VirtualNetworkRules CreateOrUpdate,
        Microsoft.Sql VirtualNetworkRules Get,
        Microsoft.Sql VirtualNetworkRules ListByServer,
        Microsoft.Sql VirtualNetworkRules Delete,
      ]
    backing: true
    note: Samples sql server firewall-rule create.
    setup:
      - group create --name {rg} --location {location}
      - >-
        sql server create --name {name:sql} --resource-group {rg} --location {location}
        --admin-user sqladmin --admin-password LocalStack123!
      - >-
        sql server firewall-rule create --server {name:sql} --resource-group {rg} --name office
        --start-ip-address 10.0.0.1 --end-ip-address 10.0.0.9
      - sql server firewall-rule show --server {name:sql} --resource-group {rg} --name office
      - sql server firewall-rule list --server {name:sql} --resource-group {rg}
      - sql server firewall-rule delete --server {name:sql} --resource-group {rg} --name office
      - >-
        network vnet create --name {name:vnet} --resource-group {rg} --address-prefixes 10.40.0.0/16
        --subnet-name data --subnet-prefixes 10.40.1.0/24
      - network vnet subnet update --vnet-name {name:vnet} --resource-group {rg} --name data --service-endpoints Microsoft.Sql
      - sql server vnet-rule create --server {name:sql} --resource-group {rg} --name data --vnet-name {name:vnet} --subnet data
      - sql server vnet-rule show --server {name:sql} --resource-group {rg} --name data
      - sql server vnet-rule list --server {name:sql} --resource-group {rg}
    command: sql server vnet-rule delete --server {name:sql} --resource-group {rg} --name data
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: sql-database
    operations:
      [
        Microsoft.Sql Databases CreateOrUpdate,
        Microsoft.Sql Databases Get,
        Microsoft.Sql Databases ListByServer,
        Microsoft.Sql Databases Update,
        Microsoft.Sql Databases Delete,
      ]
    backing: true
    note: Samples sql db create/show.
    setup:
      - group create --name {rg} --location {location}
      - >-
        sql server create --name {name:sql} --resource-group {rg} --location {location}
        --admin-user sqladmin --admin-password LocalStack123!
      - sql db create --name orders --server {name:sql} --resource-group {rg} --service-objective Basic --yes
      - run: sql db show --name orders --server {name:sql} --resource-group {rg} --query status -o tsv
        until: { stdout: { equals: Online } }
      - sql db list --server {name:sql} --resource-group {rg}
      - sql db update --name orders --server {name:sql} --resource-group {rg} --max-size 1GB
    command: sql db delete --name orders --server {name:sql} --resource-group {rg} --yes
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: sql-database-policies
    operations:
      [
        Microsoft.Sql DatabaseSecurityAlertPolicies Get,
        Microsoft.Sql DatabaseSecurityAlertPolicies CreateOrUpdate,
        Microsoft.Sql DatabaseSecurityAlertPolicies ListByDatabase,
        Microsoft.Sql DatabaseBlobAuditingPolicies Get,
        Microsoft.Sql DatabaseBlobAuditingPolicies CreateOrUpdate,
        Microsoft.Sql DatabaseBlobAuditingPolicies ListByDatabase,
        Microsoft.Sql TransparentDataEncryptions Get,
        Microsoft.Sql TransparentDataEncryptions ListByDatabase,
        Microsoft.Sql BackupShortTermRetentionPolicies Get,
        Microsoft.Sql LongTermRetentionPolicies Get,
        Microsoft.Sql DatabaseAdvancedThreatProtectionSettings Get,
        Microsoft.Sql ReplicationLinks ListByDatabase,
      ]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - >-
        sql server create --name {name:sql} --resource-group {rg} --location {location}
        --admin-user sqladmin --admin-password LocalStack123!
      - sql db create --name orders --server {name:sql} --resource-group {rg} --service-objective Basic --yes
      - sql db threat-policy show --name orders --server {name:sql} --resource-group {rg}
      # rest, not `sql db threat-policy update`: without --storage-account az looks the account up
      # with GET /subscriptions/{sub}/resources?$filter=name eq '' and (... or ...), and the
      # emulator's $filter answers 500 on any parenthesised group (4 of 4 runs).
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/databases/orders/securityAlertPolicies/default?api-version=2023-05-01-preview
        --body '{"properties": {"state": "Enabled"}}'
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/databases/orders/securityAlertPolicies?api-version=2023-05-01-preview
      - sql db audit-policy show --name orders --server {name:sql} --resource-group {rg}
      - sql db audit-policy update --name orders --server {name:sql} --resource-group {rg} --state Disabled
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/databases/orders/auditingSettings?api-version=2023-05-01-preview
      - sql db tde show --database orders --server {name:sql} --resource-group {rg}
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/databases/orders/transparentDataEncryption?api-version=2023-05-01-preview
      - sql db str-policy show --name orders --server {name:sql} --resource-group {rg}
      - sql db ltr-policy show --name orders --server {name:sql} --resource-group {rg}
      - sql db advanced-threat-protection-setting show --name orders --server {name:sql} --resource-group {rg}
    command: sql db replica list-links --name orders --server {name:sql} --resource-group {rg}
    expect:
      json: { path: "", length: 0 }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: sql-database-policy-writes
    operations:
      [
        Microsoft.Sql BackupShortTermRetentionPolicies CreateOrUpdate,
        Microsoft.Sql BackupShortTermRetentionPolicies Update,
        Microsoft.Sql BackupShortTermRetentionPolicies ListByDatabase,
        Microsoft.Sql LongTermRetentionPolicies CreateOrUpdate,
        Microsoft.Sql LongTermRetentionPolicies ListByDatabase,
        Microsoft.Sql TransparentDataEncryptions CreateOrUpdate,
        Microsoft.Sql DatabaseAdvancedThreatProtectionSettings CreateOrUpdate,
        Microsoft.Sql DatabaseAdvancedThreatProtectionSettings ListByDatabase,
        Microsoft.Sql ExtendedDatabaseBlobAuditingPolicies CreateOrUpdate,
        Microsoft.Sql ExtendedDatabaseBlobAuditingPolicies Get,
        Microsoft.Sql ExtendedDatabaseBlobAuditingPolicies ListByDatabase,
      ]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - >-
        sql server create --name {name:sql} --resource-group {rg} --location {location}
        --admin-user sqladmin --admin-password LocalStack123!
      - sql db create --name orders --server {name:sql} --resource-group {rg} --service-objective Basic --yes
      - sql db str-policy set --name orders --server {name:sql} --resource-group {rg} --retention-days 14
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/databases/orders/backupShortTermRetentionPolicies/default?api-version=2023-05-01-preview
        --body '{"properties": {"retentionDays": 21}}'
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/databases/orders/backupShortTermRetentionPolicies?api-version=2023-05-01-preview
      - sql db ltr-policy set --name orders --server {name:sql} --resource-group {rg} --weekly-retention P4W --yes
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/databases/orders/backupLongTermRetentionPolicies?api-version=2023-05-01-preview
      - sql db tde set --database orders --server {name:sql} --resource-group {rg} --status Enabled
      - >-
        sql db advanced-threat-protection-setting update --name orders --server {name:sql} --resource-group {rg}
        --state Enabled
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/databases/orders/advancedThreatProtectionSettings?api-version=2023-05-01-preview
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/databases/orders/extendedAuditingSettings/default?api-version=2023-05-01-preview
        --body '{"properties": {"state": "Disabled"}}'
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/databases/orders/extendedAuditingSettings/default?api-version=2023-05-01-preview
    command: >-
      rest --method get
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/databases/orders/extendedAuditingSettings?api-version=2023-05-01-preview
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: sql-server-policies
    operations:
      [
        Microsoft.Sql ServerSecurityAlertPolicies CreateOrUpdate,
        Microsoft.Sql ServerSecurityAlertPolicies Get,
        Microsoft.Sql ServerSecurityAlertPolicies ListByServer,
        Microsoft.Sql ServerBlobAuditingPolicies Get,
        Microsoft.Sql ServerBlobAuditingPolicies CreateOrUpdate,
        Microsoft.Sql ServerBlobAuditingPolicies ListByServer,
        Microsoft.Sql ExtendedServerBlobAuditingPolicies CreateOrUpdate,
        Microsoft.Sql ExtendedServerBlobAuditingPolicies Get,
        Microsoft.Sql ExtendedServerBlobAuditingPolicies ListByServer,
        Microsoft.Sql ServerAdvancedThreatProtectionSettings Get,
        Microsoft.Sql ServerAdvancedThreatProtectionSettings CreateOrUpdate,
        Microsoft.Sql ServerAdvancedThreatProtectionSettings ListByServer,
        Microsoft.Sql SqlVulnerabilityAssessmentsSettings CreateOrUpdate,
        Microsoft.Sql SqlVulnerabilityAssessmentsSettings Get,
        Microsoft.Sql SqlVulnerabilityAssessmentsSettings ListByServer,
      ]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - >-
        sql server create --name {name:sql} --resource-group {rg} --location {location}
        --admin-user sqladmin --admin-password LocalStack123!
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/securityAlertPolicies/Default?api-version=2023-05-01-preview
        --body '{"properties": {"state": "Enabled"}}'
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/securityAlertPolicies/Default?api-version=2023-05-01-preview
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/securityAlertPolicies?api-version=2023-05-01-preview
      - sql server audit-policy show --name {name:sql} --resource-group {rg}
      - sql server audit-policy update --name {name:sql} --resource-group {rg} --state Disabled
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/auditingSettings?api-version=2023-05-01-preview
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/extendedAuditingSettings/default?api-version=2023-05-01-preview
        --body '{"properties": {"state": "Disabled"}}'
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/extendedAuditingSettings/default?api-version=2023-05-01-preview
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/extendedAuditingSettings?api-version=2023-05-01-preview
      - sql server advanced-threat-protection-setting show --name {name:sql} --resource-group {rg}
      - sql server advanced-threat-protection-setting update --name {name:sql} --resource-group {rg} --state Enabled
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/advancedThreatProtectionSettings?api-version=2023-05-01-preview
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/sqlVulnerabilityAssessments/default?api-version=2023-05-01-preview
        --body '{"properties": {"state": "Enabled"}}'
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/sqlVulnerabilityAssessments/default?api-version=2023-05-01-preview
    command: >-
      rest --method get
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/sqlVulnerabilityAssessments?api-version=2023-05-01-preview
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: sql-server-keys-admins
    operations:
      [
        Microsoft.Sql EncryptionProtectors Get,
        Microsoft.Sql EncryptionProtectors ListByServer,
        Microsoft.Sql EncryptionProtectors CreateOrUpdate,
        Microsoft.Sql EncryptionProtectors Revalidate,
        Microsoft.Sql ServerKeys ListByServer,
        Microsoft.Sql ServerKeys Get,
        Microsoft.Sql ServerAzureAdAdministrators CreateOrUpdate,
        Microsoft.Sql ServerAzureAdAdministrators Get,
        Microsoft.Sql ServerAzureAdAdministrators ListByServer,
        Microsoft.Sql ServerAzureAdAdministrators Delete,
        Microsoft.Sql ServerAzureAdOnlyAuthentications Get,
        Microsoft.Sql ServerAzureAdOnlyAuthentications ListByServer,
      ]
    backing: true
    note: The case sets the protector with resource update.
    setup:
      - group create --name {rg} --location {location}
      - >-
        sql server create --name {name:sql} --resource-group {rg} --location {location}
        --admin-user sqladmin --admin-password LocalStack123!
      - sql server tde-key show --server {name:sql} --resource-group {rg}
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/encryptionProtector?api-version=2023-05-01-preview
      - sql server tde-key set --server {name:sql} --resource-group {rg} --server-key-type ServiceManaged
      - sql server tde-key revalidate --server {name:sql} --resource-group {rg}
      - run: sql server key list --server {name:sql} --resource-group {rg} --query "[0].name" -o tsv
        capture: key_name
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/keys/{key_name}?api-version=2023-05-01-preview
      - >-
        sql server ad-admin create --server-name {name:sql} --resource-group {rg} --display-name l2-admins
        --object-id {uuid}
      - sql server ad-admin list --server-name {name:sql} --resource-group {rg}
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/administrators/ActiveDirectory?api-version=2023-05-01-preview
      - sql server ad-only-auth get --name {name:sql} --resource-group {rg}
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/azureADOnlyAuthentications?api-version=2023-05-01-preview
    command: sql server ad-admin delete --server-name {name:sql} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: sql-elastic-pool
    operations:
      [
        Microsoft.Sql ElasticPools CreateOrUpdate,
        Microsoft.Sql ElasticPools Get,
        Microsoft.Sql ElasticPools Update,
        Microsoft.Sql ElasticPools Failover,
        Microsoft.Sql Databases ListByElasticPool,
        Microsoft.Sql ElasticPools Delete,
      ]
    backing: true
    note: >-
      One known-gap case for the family: every later step needs the pool. When the create
      passes, give show, update, failover, list-dbs and delete their steps again.
    setup:
      - group create --name {rg} --location {location}
      - >-
        sql server create --name {name:sql} --resource-group {rg} --location {location}
        --admin-user sqladmin --admin-password LocalStack123!
    command: sql elastic-pool create --name pool1 --server {name:sql} --resource-group {rg} --edition Standard --capacity 50
    expect:
      json: { path: name, equals: pool1 }
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        No elastic pool can be created. The emulator's capabilities list no pool edition
        (supportedElasticPoolEditions is []), so az refuses client-side ("Could not find tier
        Standard. Supported tiers are: []"), and a direct PUT (sku StandardPool, tier Standard)
        answers 400 InvalidTierSkuCombination "... does not support the sku 'SQLDB_StandardPool'".
      date: 2026-09-28

  - id: sql-datawarehouse-pause-resume
    operations: [Microsoft.Sql Databases Pause, Microsoft.Sql Databases Resume]
    backing: true
    note: >-
      The case runs the create that pause and resume need; when it passes, add `sql dw pause` and `sql dw resume` again.
    setup:
      - group create --name {rg} --location {location}
      - >-
        sql server create --name {name:sql} --resource-group {rg} --location {location}
        --admin-user sqladmin --admin-password LocalStack123!
    command: sql dw create --name dw1 --server {name:sql} --resource-group {rg} --service-objective DW100c
    expect:
      json: { path: name, equals: dw1 }
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        No data warehouse can be created, so Pause and Resume are unreachable. The
        capabilities list no DataWarehouse edition, and `sql dw create --service-objective DW100c`
        answers 400 InvalidTierSkuCombination "The tier 'DataWarehouse' does not support the sku
        'SQLDB_DW100c'".
      date: 2026-09-28

  - id: sql-failover-group
    operations:
      [
        Microsoft.Sql FailoverGroups CreateOrUpdate,
        Microsoft.Sql FailoverGroups Get,
        Microsoft.Sql FailoverGroups ListByServer,
        Microsoft.Sql FailoverGroups Update,
        Microsoft.Sql FailoverGroups Failover,
        Microsoft.Sql FailoverGroups ForceFailoverAllowDataLoss,
        Microsoft.Sql FailoverGroups TryPlannedBeforeForcedFailover,
        Microsoft.Sql FailoverGroups Delete,
      ]
    backing: true
    note: Two servers, so two MSSQL containers; one of the heaviest cases.
    setup:
      - group create --name {rg} --location {location}
      - >-
        sql server create --name {name:sql} --resource-group {rg} --location {location}
        --admin-user sqladmin --admin-password LocalStack123!
      - >-
        sql server create --name {name:sql2} --resource-group {rg} --location northeurope
        --admin-user sqladmin --admin-password LocalStack123!
      - >-
        sql failover-group create --name {name:fog} --server {name:sql} --resource-group {rg}
        --partner-server {name:sql2} --failover-policy Manual
      - sql failover-group show --name {name:fog} --server {name:sql} --resource-group {rg}
      - sql failover-group list --server {name:sql} --resource-group {rg}
      - sql failover-group update --name {name:fog} --server {name:sql} --resource-group {rg} --grace-period 2 --failover-policy Automatic
      - sql failover-group set-primary --name {name:fog} --server {name:sql2} --resource-group {rg}
      - sql failover-group set-primary --name {name:fog} --server {name:sql} --resource-group {rg} --allow-data-loss
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql2}/failoverGroups/{name:fog}/tryPlannedBeforeForcedFailover?api-version=2023-05-01-preview
    command: sql failover-group delete --name {name:fog} --server {name:sql} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: sql-catalogue-private-link
    operations:
      [
        Microsoft.Sql Capabilities ListByLocation,
        Microsoft.Sql Operations List,
        Microsoft.Sql PrivateLinkResources ListByServer,
        Microsoft.Sql PrivateLinkResources Get,
        Microsoft.Sql PrivateEndpointConnections ListByServer,
        Microsoft.Sql RestorableDroppedDatabases ListByServer,
        Microsoft.Sql ServerConnectionPolicies CreateOrUpdate,
        Microsoft.Sql ServerConnectionPolicies ListByServer,
      ]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - >-
        sql server create --name {name:sql} --resource-group {rg} --location {location}
        --admin-user sqladmin --admin-password LocalStack123!
      - sql db list-editions --location {location} --edition Basic --query "[].name"
      - rest --method get --url /providers/Microsoft.Sql/operations?api-version=2023-05-01-preview
      # Read back by the listed name: the emulator lists the resource as `plr` (group sqlServer),
      # where Azure names it after its group, so GET .../privateLinkResources/sqlServer is 404.
      - run: >-
          rest --method get
          --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/privateLinkResources?api-version=2023-05-01-preview
          --query "value[0].name" -o tsv
        capture: plr
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/privateLinkResources/{plr}?api-version=2023-05-01-preview
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/privateEndpointConnections?api-version=2023-05-01-preview
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/restorableDroppedDatabases?api-version=2023-05-01-preview
      - sql server conn-policy update --server {name:sql} --resource-group {rg} --connection-type Proxy
    command: >-
      rest --method get
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/connectionPolicies?api-version=2023-05-01-preview
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: sql-db-introspection
    operations:
      [
        Microsoft.Sql DatabaseSchemas ListByDatabase,
