      - sql db create --name orders --server {name:sql} --resource-group {rg} --service-objective Basic --yes
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/databases/orders/schemas?api-version=2021-11-01
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/databases/orders/schemas/dbo?api-version=2021-11-01
    command: >-
      rest --method get
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/databases/orders/schemas/dbo/tables?api-version=2021-11-01
    expect:
      json: { path: value, length: 0 }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  # --- Known gaps ---

  - id: sql-db-table-columns
    operations:
      [
        Microsoft.Sql DatabaseTables Get,
        Microsoft.Sql DatabaseColumns ListByTable,
        Microsoft.Sql DatabaseColumns Get,
      ]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - >-
        sql server create --name {name:sql} --resource-group {rg} --location {location}
        --admin-user sqladmin --admin-password LocalStack123!
      - sql db create --name orders --server {name:sql} --resource-group {rg} --service-objective Basic --yes
    # A real table has at least one column; the emulator answers an empty list even for a table
    # that does not exist (Azure: 404), so `value` merely existing proves nothing.
    command: >-
      rest --method get
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/databases/orders/schemas/dbo/tables/uatorders/columns?api-version=2021-11-01
      --query "length(value) > `0`"
    expect:
      json: { path: "", equals: true }
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        Untestable here: these read a user table, and a new database has none; neither az nor ARM
        can create one (T-SQL only). The emulator lists no column for the missing table (and answers
        200 where Azure would answer 404).
      date: 2026-09-28

  - id: sql-db-rename
    operations: [Microsoft.Sql Databases Rename]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - >-
        sql server create --name {name:sql} --resource-group {rg} --location {location}
        --admin-user sqladmin --admin-password LocalStack123!
      - sql db create --name orders --server {name:sql} --resource-group {rg} --service-objective Basic --yes
    command: sql db rename --name orders --new-name orders2 --server {name:sql} --resource-group {rg}
    expect:
      json: { path: name, equals: orders2 }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: sql-restorable-dropped-database
    operations: [Microsoft.Sql RestorableDroppedDatabases Get]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - >-
        sql server create --name {name:sql} --resource-group {rg} --location {location}
        --admin-user sqladmin --admin-password LocalStack123!
      - sql db create --name orders --server {name:sql} --resource-group {rg} --service-objective Basic --yes
      - sql db delete --name orders --server {name:sql} --resource-group {rg} --yes
    # The dropped database must be listed before its entry can be read (Get takes the listed id,
    # ".../restorableDroppedDatabases/{name},{timestamp}"); when it is, add the Get again.
    command: >-
      rest --method get
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name:sql}/restorableDroppedDatabases?api-version=2023-05-01-preview
      --query "length(value[?properties.databaseName=='orders'])"
    expect:
      json: { path: "", equals: 1 }
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        A dropped database is never listed (restorableDroppedDatabases stayed [] for two
        minutes after `sql db delete`), so Get has nothing to read.
      date: 2026-09-28

  - id: sql-connection-policy-get
    operations: [Microsoft.Sql ServerConnectionPolicies Get]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - >-
        sql server create --name {name:sql} --resource-group {rg} --location {location}
        --admin-user sqladmin --admin-password LocalStack123!
      - sql server conn-policy update --server {name:sql} --resource-group {rg} --connection-type Proxy
    command: sql server conn-policy show --server {name:sql} --resource-group {rg}
    expect:
      json: { path: connectionType, equals: Proxy }
    cleanup:
      - group delete --name {rg} --yes --no-wait
