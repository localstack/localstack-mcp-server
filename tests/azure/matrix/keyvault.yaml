# Microsoft.KeyVault: vaults (ARM), and secrets, keys and certificates (the data plane, keyed as
# `Microsoft.KeyVault Microsoft.KeyVault <Op>` in the coverage list).
# Every vault is deleted and purged before its group is deleted: a group delete only soft-deletes
# a vault, and the emulator is shared (plan section 7, local safety).
#
# R.1 (typed server COVERAGE_SKIPS): the 17 certificate skips were about T2's inline timing (slow
# RSA generation) or its args builder not threading a version through; the CLI waits for the
# certificate and passes real versions, so they are plain cases here. Only the contacts route
# (SetCertificateContacts and its two siblings) is carried as a known gap.
provider: Microsoft.KeyVault
cases:
  - id: kv-create
    operations: [Microsoft.KeyVault Vaults CreateOrUpdate]
    pr: true
    setup:
      - group create --name {rg} --location {location}
    command: keyvault create --name {vault} --resource-group {rg} --location {location}
    expect:
      json:
        - { path: name, equals: "{vault}" }
        - { path: properties.vaultUri, contains: "{vault}" }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-check-name
    operations: [Microsoft.KeyVault Vaults CheckNameAvailability]
    note: "`keyvault check-name` checks managed-HSM names (kv-hsm-check-name); vaults go through rest."
    command: >-
      rest --method post
      --url /subscriptions/{sub}/providers/Microsoft.KeyVault/checkNameAvailability?api-version=2023-07-01
      --body '{"name": "{vault}", "type": "Microsoft.KeyVault/vaults"}'
    expect:
      json: { path: nameAvailable, equals: true }

  - id: kv-hsm-check-name
    operations: [Microsoft.KeyVault ManagedHsms CheckMhsmNameAvailability]
    command: keyvault check-name --name {vault}
    expect:
      json: { path: nameAvailable, equals: true }
    known_gap:
      reason: >-
        Found by L2: `az keyvault check-name` (az 2.85) POSTs .../checkMhsmNameAvailability, which
        the emulator answers with NotImplemented (the coverage list marks it not implemented).
      date: 2026-09-27

  - id: kv-show-list
    operations:
      [
        Microsoft.KeyVault Vaults Get,
        Microsoft.KeyVault Vaults ListByResourceGroup,
        Microsoft.KeyVault Vaults ListBySubscription,
      ]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - run: keyvault show --name {vault} --resource-group {rg}
        until: { json: { path: name, equals: "{vault}" } }
      - run: keyvault list --resource-group {rg} --query "[].name"
        until: { json: { path: "", equals: ["{vault}"] } }
    command: keyvault list --query "[?name=='{vault}'].name"
    expect:
      json: { path: "", equals: ["{vault}"] }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-update
    operations: [Microsoft.KeyVault Vaults Update]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
    command: keyvault update --name {vault} --resource-group {rg} --enabled-for-deployment true
    expect:
      json: { path: properties.enabledForDeployment, equals: true }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-set-policy
    operations: [Microsoft.KeyVault Vaults UpdateAccessPolicy]
    note: The benchmark's oracle (ta.py kv-access-policy-grant); access policies need a non-RBAC vault.
    setup:
      - group create --name {rg} --location {location}
      - >-
        keyvault create --name {vault} --resource-group {rg} --location {location}
        --enable-rbac-authorization false
    command: >-
      keyvault set-policy --name {vault} --resource-group {rg} --object-id {uuid}
      --secret-permissions get list
    expect:
      json: { path: "properties.accessPolicies[-1].objectId", equals: "{uuid}" }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-soft-delete
    operations:
      [
        Microsoft.KeyVault Vaults Delete,
        Microsoft.KeyVault Vaults GetDeleted,
        Microsoft.KeyVault Vaults ListDeleted,
      ]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - keyvault delete --name {vault}
      - run: keyvault show-deleted --name {vault}
        until: { json: { path: name, equals: "{vault}" } }
    command: keyvault list-deleted --query "[?name=='{vault}'].name"
    expect:
      json: { path: "", equals: ["{vault}"] }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-purge-recover
    operations: [Microsoft.KeyVault Vaults PurgeDeleted, Microsoft.KeyVault Vaults CreateOrUpdate]
    note: Samples run `keyvault recover` then `keyvault purge` (keyvault list-deleted/recover/purge).
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - keyvault delete --name {vault}
      - keyvault recover --name {vault}
      - run: keyvault show --name {vault}
        until: { json: { path: name, equals: "{vault}" } }
      - keyvault delete --name {vault}
    command: keyvault purge --name {vault}
    expect:
      exitCode: 0
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-hsm-lists
    operations:
      [
        Microsoft.KeyVault ManagedHsms ListByResourceGroup,
        Microsoft.KeyVault ManagedHsms ListBySubscription,
        Microsoft.KeyVault ManagedHsms ListDeleted,
      ]
    setup:
      - group create --name {rg} --location {location}
      - run: keyvault list --resource-type hsm --resource-group {rg}
        until: { json: { path: "", length: 0 } }
      - keyvault list --resource-type hsm --query "length(@)"
    command: keyvault list-deleted --resource-type hsm --query "length(@)"
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  # --- Secrets: the data plane (samples keyvault secret set/show/list) ---

  - id: kv-secret-set-show
    operations:
      [
        Microsoft.KeyVault Microsoft.KeyVault SetSecret,
        Microsoft.KeyVault Microsoft.KeyVault GetSecret,
      ]
    pr: true
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - keyvault secret set --vault-name {vault} --name db-password --value "l2 matrix ✓ {id}"
    command: keyvault secret show --vault-name {vault} --name db-password --query value -o tsv
    expect:
      stdout: { equals: "l2 matrix ✓ {id}" }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-secret-list-versions
    operations:
      [
        Microsoft.KeyVault Microsoft.KeyVault GetSecrets,
        Microsoft.KeyVault Microsoft.KeyVault GetSecretVersions,
      ]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - keyvault secret set --vault-name {vault} --name api-key --value one
      - keyvault secret set --vault-name {vault} --name api-key --value two
      - run: keyvault secret list --vault-name {vault} --query "[].name"
        until: { json: { path: "", equals: [api-key] } }
    command: keyvault secret list-versions --vault-name {vault} --name api-key --query "length(@)"
    expect:
      json: { path: "", equals: 2 }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  # R.1: UpdateSecret was skipped because T2 had no real version to PATCH; the CLI passes the id.
  - id: kv-secret-set-attributes
    operations: [Microsoft.KeyVault Microsoft.KeyVault UpdateSecret]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - run: keyvault secret set --vault-name {vault} --name api-key --value one --query id -o tsv
        capture: secret_id
    command: keyvault secret set-attributes --id {secret_id} --enabled false --tags matrix=l2
    expect:
      json:
        - { path: attributes.enabled, equals: false }
        - { path: tags.matrix, equals: l2 }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-secret-delete-recover
    operations:
      [
        Microsoft.KeyVault Microsoft.KeyVault DeleteSecret,
        Microsoft.KeyVault Microsoft.KeyVault GetDeletedSecret,
        Microsoft.KeyVault Microsoft.KeyVault GetDeletedSecrets,
        Microsoft.KeyVault Microsoft.KeyVault RecoverDeletedSecret,
      ]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - keyvault secret set --vault-name {vault} --name api-key --value one
      - keyvault secret delete --vault-name {vault} --name api-key
      - run: keyvault secret show-deleted --vault-name {vault} --name api-key
        until: { json: { path: recoveryId, contains: api-key } }
      - run: keyvault secret list-deleted --vault-name {vault} --query "[].name"
        until: { json: { path: "", equals: [api-key] } }
      - keyvault secret recover --vault-name {vault} --name api-key
    command: keyvault secret show --vault-name {vault} --name api-key --query value -o tsv
    expect:
      stdout: { equals: one }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-secret-purge
    operations: [Microsoft.KeyVault Microsoft.KeyVault PurgeDeletedSecret]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - keyvault secret set --vault-name {vault} --name api-key --value one
      - keyvault secret delete --vault-name {vault} --name api-key
    command: keyvault secret purge --vault-name {vault} --name api-key
    expect:
      exitCode: 0
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  # --- Secrets through ARM (Microsoft.KeyVault Secrets) ---

  - id: kv-arm-secrets
    operations:
      [
        Microsoft.KeyVault Secrets CreateOrUpdate,
        Microsoft.KeyVault Secrets Get,
        Microsoft.KeyVault Secrets List,
      ]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.KeyVault/vaults/{vault}/secrets/arm-secret?api-version=2023-07-01
        --body '{"properties": {"value": "from-arm", "contentType": "text/plain"}}'
      - run: >-
          rest --method get
          --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.KeyVault/vaults/{vault}/secrets/arm-secret?api-version=2023-07-01
        until: { json: { path: properties.contentType, equals: text/plain } }
    command: >-
      rest --method get
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.KeyVault/vaults/{vault}/secrets?api-version=2023-07-01
    expect:
      json: { path: "value[0].name", equals: arm-secret }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  # R.1: the typed server skipped Secrets_Update for its args builder (no version segment); ARM
  # PATCH needs none, and it still fails, for a different reason (the diagnosis below).
  - id: kv-arm-secret-update
    operations: [Microsoft.KeyVault Secrets Update]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.KeyVault/vaults/{vault}/secrets/arm-secret?api-version=2023-07-01
        --body '{"properties": {"value": "from-arm", "contentType": "text/plain"}}'
    command: >-
      rest --method patch
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.KeyVault/vaults/{vault}/secrets/arm-secret?api-version=2023-07-01
      --body '{"properties": {"contentType": "application/json"}}'
    expect:
      json: { path: properties.contentType, equals: application/json }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        Found by L2 (carrying the typed server's Secrets_Update skip): a PATCH shaped like Azure's
        SecretPatchParameters (contentType only; `value` is not patchable) answers HTTP 400
        ParameterNotSpecified "The parameter value is not specified".
      date: 2026-09-27

  # --- Keys (the benchmark's kv-sign, kv-decrypt, kv-rotation-policy, kv-deleted-key oracles) ---

  - id: kv-key-create-show
    operations:
      [
        Microsoft.KeyVault Microsoft.KeyVault CreateKey,
        Microsoft.KeyVault Microsoft.KeyVault GetKey,
      ]
    pr: true
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - keyvault key create --vault-name {vault} --name signing-key --kty RSA --size 2048
    command: keyvault key show --vault-name {vault} --name signing-key
    expect:
      json:
        - { path: key.kty, equals: RSA }
        - { path: key.kid, contains: signing-key }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-key-list-versions-update
    operations:
      [
        Microsoft.KeyVault Microsoft.KeyVault GetKeys,
        Microsoft.KeyVault Microsoft.KeyVault GetKeyVersions,
        Microsoft.KeyVault Microsoft.KeyVault UpdateKey,
      ]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - keyvault key create --vault-name {vault} --name k1 --kty RSA
      - run: keyvault key list --vault-name {vault} --query "[].name"
        until: { json: { path: "", equals: [k1] } }
      - run: keyvault key list-versions --vault-name {vault} --name k1 --query "length(@)"
        until: { json: { path: "", equals: 1 } }
    command: keyvault key set-attributes --vault-name {vault} --name k1 --tags matrix=l2
    expect:
      json: { path: tags.matrix, equals: l2 }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-key-encrypt-decrypt
    operations:
      [Microsoft.KeyVault Microsoft.KeyVault Encrypt, Microsoft.KeyVault Microsoft.KeyVault Decrypt]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - keyvault key create --vault-name {vault} --name k1 --kty RSA
      - run: >-
          keyvault key encrypt --vault-name {vault} --name k1 --algorithm RSA-OAEP
          --value "bDIgbWF0cml4" --data-type base64 --query result -o tsv
        capture: ciphertext
    command: >-
      keyvault key decrypt --vault-name {vault} --name k1 --algorithm RSA-OAEP
      --value {ciphertext} --data-type base64 --query result -o tsv
    expect:
      stdout: { equals: bDIgbWF0cml4 }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-key-sign-verify
    operations:
      [Microsoft.KeyVault Microsoft.KeyVault Sign, Microsoft.KeyVault Microsoft.KeyVault Verify]
    note: The digest is the base64 SHA-256 of "l2".
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - keyvault key create --vault-name {vault} --name k1 --kty RSA
      - run: >-
          keyvault key sign --vault-name {vault} --name k1 --algorithm RS256
          --digest "rNTB+Uqh7cXmrqiKnRpsh1oI6xkCGMwVtfHXdVbCFZE=" --query signature -o tsv
        capture: signature
    command: >-
      keyvault key verify --vault-name {vault} --name k1 --algorithm RS256
      --digest "rNTB+Uqh7cXmrqiKnRpsh1oI6xkCGMwVtfHXdVbCFZE=" --signature {signature}
    expect:
      json: { path: isValid, equals: true }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-key-wrap-unwrap
    operations:
      [
        Microsoft.KeyVault Microsoft.KeyVault WrapKey,
        Microsoft.KeyVault Microsoft.KeyVault UnwrapKey,
      ]
    note: az has no `key wrap`; the data-plane REST call goes to the vault URI, a local host.
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - run: keyvault show --name {vault} --query properties.vaultUri -o tsv
        capture: vault_uri
      - run: keyvault key create --vault-name {vault} --name k1 --kty RSA --query key.kid -o tsv
        capture: kid
      - run: >-
          rest --method post --url {kid}/wrapkey?api-version=7.4 --resource https://vault.azure.net
          --body '{"alg": "RSA-OAEP", "value": "bDItbWF0cml4LWtleQ"}'
        capture: { wrapped: value }
    command: >-
      rest --method post --url {kid}/unwrapkey?api-version=7.4 --resource https://vault.azure.net
      --body '{"alg": "RSA-OAEP", "value": "{wrapped}"}'
    expect:
      json: { path: value, equals: bDItbWF0cml4LWtleQ }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-key-rotation
    operations:
      [
        Microsoft.KeyVault Microsoft.KeyVault RotateKey,
        Microsoft.KeyVault Microsoft.KeyVault GetKeyRotationPolicy,
        Microsoft.KeyVault Microsoft.KeyVault UpdateKeyRotationPolicy,
      ]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - keyvault key create --vault-name {vault} --name k1 --kty RSA
      - >-
        keyvault key rotation-policy update --vault-name {vault} --name k1
        --value '{"lifetimeActions": [{"trigger": {"timeBeforeExpiry": "P30D"}, "action": {"type": "Rotate"}}],
        "attributes": {"expiryTime": "P1Y"}}'
      - run: keyvault key rotation-policy show --vault-name {vault} --name k1
        until: { json: { path: expiresIn, equals: P1Y } }
    command: keyvault key rotate --vault-name {vault} --name k1
    expect:
      json: { path: key.kid, contains: /keys/k1/ }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-key-backup-restore
    operations:
      [
        Microsoft.KeyVault Microsoft.KeyVault BackupKey,
        Microsoft.KeyVault Microsoft.KeyVault RestoreKey,
      ]
    note: The backup file is written into the tool's working directory.
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - keyvault key create --vault-name {vault} --name k1 --kty RSA
      - keyvault key backup --vault-name {vault} --name k1 --file k1-{id}.backup
      - keyvault key delete --vault-name {vault} --name k1
      - keyvault key purge --vault-name {vault} --name k1
    command: keyvault key restore --vault-name {vault} --file k1-{id}.backup
    expect:
      json: { path: key.kid, contains: /keys/k1/ }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-key-delete-recover-purge
    operations:
      [
        Microsoft.KeyVault Microsoft.KeyVault DeleteKey,
        Microsoft.KeyVault Microsoft.KeyVault GetDeletedKey,
        Microsoft.KeyVault Microsoft.KeyVault GetDeletedKeys,
        Microsoft.KeyVault Microsoft.KeyVault RecoverDeletedKey,
        Microsoft.KeyVault Microsoft.KeyVault PurgeDeletedKey,
      ]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - keyvault key create --vault-name {vault} --name k1 --kty RSA
      - keyvault key create --vault-name {vault} --name k2 --kty RSA
      - keyvault key delete --vault-name {vault} --name k1
      - keyvault key delete --vault-name {vault} --name k2
      - run: keyvault key show-deleted --vault-name {vault} --name k1
        until: { json: { path: recoveryId, contains: k1 } }
      - run: keyvault key list-deleted --vault-name {vault} --query "length(@)"
        until: { json: { path: "", equals: 2 } }
      - keyvault key recover --vault-name {vault} --name k1
      - keyvault key purge --vault-name {vault} --name k2
    command: keyvault key list --vault-name {vault} --query "[].name"
    expect:
      json: { path: "", equals: [k1] }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  # --- Certificates (samples keyvault certificate create; the typed server's 17 skips) ---

  - id: kv-cert-create-show
    operations:
      [
        Microsoft.KeyVault Microsoft.KeyVault CreateCertificate,
        Microsoft.KeyVault Microsoft.KeyVault GetCertificate,
      ]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - run: keyvault certificate get-default-policy -o json
        capture: policy
      - keyvault certificate create --vault-name {vault} --name web-cert --policy '{policy}'
    command: keyvault certificate show --vault-name {vault} --name web-cert
    expect:
      json:
        - { path: name, equals: web-cert }
        - { path: policy.keyProperties.keyType, equals: RSA }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-cert-list-versions-pending
    operations:
      [
        Microsoft.KeyVault Microsoft.KeyVault GetCertificates,
        Microsoft.KeyVault Microsoft.KeyVault GetCertificateVersions,
        Microsoft.KeyVault Microsoft.KeyVault GetCertificateOperation,
      ]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - run: keyvault certificate get-default-policy -o json
        capture: policy
      - keyvault certificate create --vault-name {vault} --name web-cert --policy '{policy}'
      - run: keyvault certificate list --vault-name {vault} --query "[].name"
        until: { json: { path: "", equals: [web-cert] } }
      - run: keyvault certificate list-versions --vault-name {vault} --name web-cert --query "length(@)"
        until: { json: { path: "", equals: 1 } }
    command: keyvault certificate pending show --vault-name {vault} --name web-cert
    expect:
      json: { path: status, equals: completed }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-cert-policy-attributes
    operations:
      [
        Microsoft.KeyVault Microsoft.KeyVault GetCertificatePolicy,
        Microsoft.KeyVault Microsoft.KeyVault UpdateCertificatePolicy,
        Microsoft.KeyVault Microsoft.KeyVault UpdateCertificate,
      ]
    note: "`certificate set-attributes --policy` PATCHes the policy; its GET has no az verb, so rest reads it."
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - run: keyvault show --name {vault} --query properties.vaultUri -o tsv
        capture: vault_uri
      - run: keyvault certificate get-default-policy -o json
        capture: policy
      - keyvault certificate create --vault-name {vault} --name web-cert --policy '{policy}'
      - keyvault certificate set-attributes --vault-name {vault} --name web-cert --tags matrix=l2
      - run: keyvault certificate show --vault-name {vault} --name web-cert
        until: { json: { path: tags.matrix, equals: l2 } }
      - keyvault certificate set-attributes --vault-name {vault} --name web-cert --policy '{policy}'
    command: >-
      rest --method get --url {vault_uri}/certificates/web-cert/policy?api-version=7.4
      --resource https://vault.azure.net
    expect:
      json: { path: key_props.kty, equals: RSA }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-cert-delete-recover-purge
    operations:
      [
        Microsoft.KeyVault Microsoft.KeyVault DeleteCertificate,
        Microsoft.KeyVault Microsoft.KeyVault GetDeletedCertificate,
        Microsoft.KeyVault Microsoft.KeyVault GetDeletedCertificates,
        Microsoft.KeyVault Microsoft.KeyVault RecoverDeletedCertificate,
        Microsoft.KeyVault Microsoft.KeyVault PurgeDeletedCertificate,
      ]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - run: keyvault certificate get-default-policy -o json
        capture: policy
      - keyvault certificate create --vault-name {vault} --name c1 --policy '{policy}'
      - keyvault certificate create --vault-name {vault} --name c2 --policy '{policy}'
      - keyvault certificate delete --vault-name {vault} --name c1
      - keyvault certificate delete --vault-name {vault} --name c2
      - run: keyvault certificate show-deleted --vault-name {vault} --name c1
        until: { json: { path: recoveryId, contains: c1 } }
      - run: keyvault certificate list-deleted --vault-name {vault} --query "length(@)"
        until: { json: { path: "", equals: 2 } }
      - keyvault certificate recover --vault-name {vault} --name c1
      - keyvault certificate purge --vault-name {vault} --name c2
    command: keyvault certificate list --vault-name {vault} --query "[].name"
    expect:
      json: { path: "", equals: [c1] }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-cert-contacts
    operations:
      [
        Microsoft.KeyVault Microsoft.KeyVault SetCertificateContacts,
        Microsoft.KeyVault Microsoft.KeyVault GetCertificateContacts,
        Microsoft.KeyVault Microsoft.KeyVault DeleteCertificateContacts,
      ]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - >-
        keyvault certificate contact add --vault-name {vault} --email l2-matrix@example.com --name L2
        --phone 5550100
      - run: keyvault certificate contact list --vault-name {vault}
        until: { stdout: { contains: l2-matrix@example.com } }
    command: keyvault certificate contact delete --vault-name {vault} --email l2-matrix@example.com
    expect:
      exitCode: 0
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: kv-cert-contact-without-phone
    operations: [Microsoft.KeyVault Microsoft.KeyVault SetCertificateContacts]
    setup:
      - group create --name {rg} --location {location}
      - keyvault create --name {vault} --resource-group {rg} --location {location}
    command: keyvault certificate contact add --vault-name {vault} --email l2-matrix@example.com --name L2
    expect:
      stdout: { contains: l2-matrix@example.com }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        Found by L2 (the typed server's diagnosis was a 404 on /certificates/contacts; the route now
        answers): a contact without a phone number, which Azure accepts, is refused with
        (BadParameter) "Property contacts[0] has invalid value. Phone number is too long".
      date: 2026-09-27
