# Microsoft.KubernetesConfiguration: cluster extensions (extension k8s-extension) on an AKS
# cluster, so every case is `backing: true` and heavy (a k3d cluster).
# An extension needs a running cluster (the create answers 409 ClusterNotRunning), and no AKS
# cluster reaches Running through ARM on the current emulator (see containerservice.yaml
# aks-start-run-command), so the extension operations are known gaps.
provider: Microsoft.KubernetesConfiguration
cases:
  - id: k8s-extension-list
    operations: [Microsoft.KubernetesConfiguration Extensions List]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - aks create --name {name:aks} --resource-group {rg} --node-count 1 --generate-ssh-keys --no-wait --yes
      - run: aks show --name {name:aks} --resource-group {rg} --query provisioningState -o tsv
        until: { stdout: { equals: Succeeded } }
        wait: 900
    command: >-
      k8s-extension list --cluster-name {name:aks} --cluster-type managedClusters --resource-group {rg}
    expect:
      json: { path: "", length: 0 }
    cleanup:
      - aks delete --name {name:aks} --resource-group {rg} --yes --no-wait
      - group delete --name {rg} --yes --no-wait

  - id: k8s-extension-lifecycle
    operations:
      [
        Microsoft.KubernetesConfiguration Extensions Create,
        Microsoft.KubernetesConfiguration Extensions Get,
        Microsoft.KubernetesConfiguration Extensions Update,
        Microsoft.KubernetesConfiguration Extensions Delete,
        Microsoft.KubernetesConfiguration OperationStatus Get,
      ]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - aks create --name {name:aks} --resource-group {rg} --node-count 1 --generate-ssh-keys --no-wait --yes
      - run: aks show --name {name:aks} --resource-group {rg} --query provisioningState -o tsv
        until: { stdout: { equals: Succeeded } }
        wait: 900
    command: >-
      k8s-extension create --name appconfig --extension-type microsoft.appconfiguration
      --cluster-name {name:aks} --cluster-type managedClusters --resource-group {rg}
    expect:
      json: { path: provisioningState, equals: Succeeded }
    cleanup:
      - aks delete --name {name:aks} --resource-group {rg} --yes --no-wait
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        Every extension write needs a running cluster (the create handler
        raises ClusterNotRunning), and no AKS cluster reaches Running through ARM on the current
        emulator, so Create, and with it Get, Update, Delete and the operation status, cannot succeed
        (the case creates the extension).
      date: 2026-09-27
