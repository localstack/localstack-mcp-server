    note: Samples network public-ip prefix create/show.
    setup:
      - group create --name {rg} --location {location}
      - network public-ip prefix create --name {name:ippre} --resource-group {rg} --length 30
      - run: network public-ip prefix show --name {name:ippre} --resource-group {rg} --query prefixLength
        until: { json: { path: "", equals: 30 } }
      - network public-ip prefix list --resource-group {rg}
      - network public-ip prefix list --query "[?name=='{name:ippre}'].name"
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/publicIPPrefixes/{name:ippre}?api-version=2023-09-01
        --body '{"tags": {"matrix": "l2"}}'
    command: network public-ip prefix delete --name {name:ippre} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-nat-gateway
    operations:
      [
        Microsoft.Network NatGateways CreateOrUpdate,
        Microsoft.Network NatGateways Get,
        Microsoft.Network NatGateways List,
        Microsoft.Network NatGateways ListAll,
        Microsoft.Network NatGateways UpdateTags,
        Microsoft.Network NatGateways Delete,
      ]
    note: Samples network nat gateway create/show.
    setup:
      - group create --name {rg} --location {location}
      - network public-ip create --name {name:pip} --resource-group {rg} --sku Standard
      - >-
        network nat gateway create --name {name:nat} --resource-group {rg} --location {location}
        --public-ip-addresses {name:pip} --idle-timeout 10
      - run: network nat gateway show --name {name:nat} --resource-group {rg} --query idleTimeoutInMinutes
        until: { json: { path: "", equals: 10 } }
      - network nat gateway list --resource-group {rg}
      - >-
        rest --method get
        --url /subscriptions/{sub}/providers/Microsoft.Network/natGateways?api-version=2023-09-01
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/natGateways/{name:nat}?api-version=2023-09-01
        --body '{"tags": {"matrix": "l2"}}'
    command: network nat gateway delete --name {name:nat} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-route-table
    operations:
      [
        Microsoft.Network RouteTables CreateOrUpdate,
        Microsoft.Network Routes CreateOrUpdate,
        Microsoft.Network Routes Get,
        Microsoft.Network Routes List,
      ]
    note: The benchmark's oracles (ta.py route-get, routes-list).
    setup:
      - group create --name {rg} --location {location}
      - network route-table create --name {name:rt} --resource-group {rg} --location {location}
      - >-
        network route-table route create --route-table-name {name:rt} --resource-group {rg} --name to-appliance
        --address-prefix 10.20.0.0/16 --next-hop-type VirtualAppliance --next-hop-ip-address 10.10.1.4
      - run: network route-table route show --route-table-name {name:rt} --resource-group {rg} --name to-appliance
        until: { json: { path: nextHopIpAddress, equals: 10.10.1.4 } }
    command: network route-table route list --route-table-name {name:rt} --resource-group {rg} --query "[].name"
    expect:
      json: { path: "", equals: [to-appliance] }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-route-table-read-delete
    operations:
      [
        Microsoft.Network RouteTables Get,
        Microsoft.Network RouteTables List,
        Microsoft.Network RouteTables ListAll,
        Microsoft.Network RouteTables UpdateTags,
        Microsoft.Network RouteTables Delete,
        Microsoft.Network Routes Delete,
      ]
    setup:
      - group create --name {rg} --location {location}
      - network route-table create --name {name:rt} --resource-group {rg}
      - >-
        network route-table route create --route-table-name {name:rt} --resource-group {rg} --name internet
        --address-prefix 0.0.0.0/0 --next-hop-type Internet
      - network route-table route delete --route-table-name {name:rt} --resource-group {rg} --name internet
      - run: network route-table show --name {name:rt} --resource-group {rg} --query "routes[].name"
        until: { json: { path: "", length: 0 } }
      - network route-table list --resource-group {rg}
      # rest: az 2.90 makes --resource-group required for `network route-table list` (2.85 lists the
      # subscription without it), so ListAll has no az form on both versions.
      - >-
        rest --method get
        --url /subscriptions/{sub}/providers/Microsoft.Network/routeTables?api-version=2023-09-01
        --query "value[?name=='{name:rt}'].name"
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/routeTables/{name:rt}?api-version=2023-09-01
        --body '{"tags": {"matrix": "l2"}}'
    command: network route-table delete --name {name:rt} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-nic
    operations:
      [
        Microsoft.Network NetworkInterfaces CreateOrUpdate,
        Microsoft.Network NetworkInterfaces Get,
        Microsoft.Network NetworkInterfaces List,
        Microsoft.Network NetworkInterfaces ListAll,
        Microsoft.Network NetworkInterfaces UpdateTags,
        Microsoft.Network NetworkInterfaces Delete,
      ]
    setup:
      - group create --name {rg} --location {location}
      - >-
        network vnet create --name {name:vnet} --resource-group {rg} --address-prefixes 10.14.0.0/16
        --subnet-name default --subnet-prefixes 10.14.1.0/24
      - network nic create --name {name:nic} --resource-group {rg} --vnet-name {name:vnet} --subnet default
      - run: network nic show --name {name:nic} --resource-group {rg} --query "ipConfigurations[0].subnet.id"
        until: { json: { path: "", matches: "/subnets/default$" } }
      - network nic list --resource-group {rg}
      - network nic list --query "[?name=='{name:nic}'].name"
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/networkInterfaces/{name:nic}?api-version=2023-09-01
        --body '{"tags": {"matrix": "l2"}}'
    command: network nic delete --name {name:nic} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-lb
    operations:
      [
        Microsoft.Network LoadBalancers CreateOrUpdate,
        Microsoft.Network LoadBalancerFrontendIpConfigurations List,
        Microsoft.Network LoadBalancerFrontendIpConfigurations Get,
        Microsoft.Network LoadBalancerBackendAddressPools List,
        Microsoft.Network LoadBalancerBackendAddressPools Get,
      ]
    pr: true
    setup:
      - group create --name {rg} --location {location}
      - >-
        network lb create --name {name:lb} --resource-group {rg} --location {location} --sku Standard
        --frontend-ip-name fe --backend-pool-name be
      - run: network lb frontend-ip list --lb-name {name:lb} --resource-group {rg} --query "[].name"
        until: { json: { path: "", equals: [fe] } }
      - network lb frontend-ip show --lb-name {name:lb} --resource-group {rg} --name fe
      - network lb address-pool show --lb-name {name:lb} --resource-group {rg} --name be
    command: network lb address-pool list --lb-name {name:lb} --resource-group {rg} --query "[].name"
    expect:
      json: { path: "", equals: [be] }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-lb-probe-rule
    operations:
      [
        Microsoft.Network LoadBalancerProbes List,
        Microsoft.Network LoadBalancerProbes Get,
        Microsoft.Network LoadBalancerLoadBalancingRules List,
        Microsoft.Network LoadBalancerLoadBalancingRules Get,
        Microsoft.Network LoadBalancerOutboundRules List,
      ]
    note: The benchmark's oracle (ta.py lb-outbound-rules).
    setup:
      - group create --name {rg} --location {location}
      - >-
        network lb create --name {name:lb} --resource-group {rg} --sku Standard --frontend-ip-name fe
        --backend-pool-name be
      - network lb probe create --lb-name {name:lb} --resource-group {rg} --name http --protocol Tcp --port 80
      - >-
        network lb rule create --lb-name {name:lb} --resource-group {rg} --name web --protocol Tcp
        --frontend-port 80 --backend-port 80 --frontend-ip-name fe --backend-pool-name be --probe-name http
      - run: network lb probe list --lb-name {name:lb} --resource-group {rg} --query "[].name"
        until: { json: { path: "", equals: [http] } }
      - network lb probe show --lb-name {name:lb} --resource-group {rg} --name http
      - run: network lb rule show --lb-name {name:lb} --resource-group {rg} --name web --query frontendPort
        until: { json: { path: "", equals: 80 } }
      - network lb outbound-rule list --lb-name {name:lb} --resource-group {rg}
    command: network lb rule list --lb-name {name:lb} --resource-group {rg} --query "[].name"
    expect:
      json: { path: "", equals: [web] }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-lb-children-api
    operations:
      [
        Microsoft.Network InboundNatRules CreateOrUpdate,
        Microsoft.Network InboundNatRules Get,
        Microsoft.Network InboundNatRules List,
        Microsoft.Network InboundNatRules Delete,
        Microsoft.Network LoadBalancerBackendAddressPools CreateOrUpdate,
        Microsoft.Network LoadBalancerBackendAddressPools Delete,
        Microsoft.Network LoadBalancerNetworkInterfaces List,
      ]
    setup:
      - group create --name {rg} --location {location}
      - network lb create --name {name:lb} --resource-group {rg} --sku Standard --frontend-ip-name fe
      - >-
        network lb inbound-nat-rule create --lb-name {name:lb} --resource-group {rg} --name ssh
        --protocol Tcp --frontend-port 50022 --backend-port 22 --frontend-ip-name fe
      - run: network lb inbound-nat-rule show --lb-name {name:lb} --resource-group {rg} --name ssh --query frontendPort
        until: { json: { path: "", equals: 50022 } }
      - network lb inbound-nat-rule list --lb-name {name:lb} --resource-group {rg}
      - network lb inbound-nat-rule delete --lb-name {name:lb} --resource-group {rg} --name ssh
      - network lb address-pool create --lb-name {name:lb} --resource-group {rg} --name extra
      - network lb address-pool delete --lb-name {name:lb} --resource-group {rg} --name extra
    command: >-
      rest --method get
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/loadBalancers/{name:lb}/networkInterfaces?api-version=2023-09-01
    expect:
      json: { path: value, length: 0 }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-lb-read-delete
    operations:
      [
        Microsoft.Network LoadBalancers Get,
        Microsoft.Network LoadBalancers List,
        Microsoft.Network LoadBalancers ListAll,
        Microsoft.Network LoadBalancers UpdateTags,
        Microsoft.Network LoadBalancers Delete,
      ]
    setup:
      - group create --name {rg} --location {location}
      - network lb create --name {name:lb} --resource-group {rg} --sku Standard
      - run: network lb show --name {name:lb} --resource-group {rg} --query sku.name -o tsv
        until: { stdout: { equals: Standard } }
      - network lb list --resource-group {rg}
      - network lb list --query "[?name=='{name:lb}'].name"
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/loadBalancers/{name:lb}?api-version=2023-09-01
        --body '{"tags": {"matrix": "l2"}}'
    command: network lb delete --name {name:lb} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  # --- Private DNS (samples network private-dns zone/link; ta.py private-dns-zones-list) ---

  - id: network-private-dns-zone
    operations:
      [
        Microsoft.Network PrivateZones CreateOrUpdate,
        Microsoft.Network PrivateZones ListByResourceGroup,
      ]
    pr: true
    setup:
      - group create --name {rg} --location {location}
      - network private-dns zone create --resource-group {rg} --name {id}.l2.internal
    command: network private-dns zone list --resource-group {rg} --query "[].name"
    expect:
      json: { path: "", equals: ["{id}.l2.internal"] }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-private-dns-records
    operations:
      [
        Microsoft.Network RecordSets CreateOrUpdate,
        Microsoft.Network RecordSets Get,
        Microsoft.Network RecordSets ListByType,
        Microsoft.Network RecordSets List,
        Microsoft.Network RecordSets Update,
        Microsoft.Network RecordSets Delete,
      ]
    setup:
      - group create --name {rg} --location {location}
      - network private-dns zone create --resource-group {rg} --name {id}.l2.internal
      - >-
        network private-dns record-set a add-record --resource-group {rg} --zone-name {id}.l2.internal
        --record-set-name www --ipv4-address 10.10.1.4
      - run: network private-dns record-set a show --resource-group {rg} --zone-name {id}.l2.internal --name www
        until: { json: { path: "aRecords[0].ipv4Address", equals: 10.10.1.4 } }
      - network private-dns record-set a list --resource-group {rg} --zone-name {id}.l2.internal
      - >-
        network private-dns record-set a update --resource-group {rg} --zone-name {id}.l2.internal
        --name www --metadata matrix=l2
      - >-
        network private-dns record-set a add-record --resource-group {rg} --zone-name {id}.l2.internal
        --record-set-name old --ipv4-address 10.10.1.9
      - network private-dns record-set a delete --resource-group {rg} --zone-name {id}.l2.internal --name old --yes
    command: network private-dns record-set list --resource-group {rg} --zone-name {id}.l2.internal --query "[].name"
    expect:
      json: { path: "", contains: www }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-private-dns-empty-record-set
    operations: [Microsoft.Network RecordSets CreateOrUpdate]
    note: Azure creates an empty A record set (`record-set a create` without records).
    setup:
      - group create --name {rg} --location {location}
      - network private-dns zone create --resource-group {rg} --name {id}.l2.internal
    command: >-
      network private-dns record-set a create --resource-group {rg} --zone-name {id}.l2.internal
      --name empty
    expect:
      json: { path: name, equals: empty }
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        L2: the emulator refuses an empty record set with 400 BadParameter "A record 'empty' requires
        at least one IP address"; Azure allows empty record sets (the CLI documents `create` as
        "Create an empty A record set").
      date: 2026-09-27

  - id: network-private-dns-link
    operations:
      [
        Microsoft.Network VirtualNetworkLinks CreateOrUpdate,
        Microsoft.Network VirtualNetworkLinks Get,
        Microsoft.Network VirtualNetworkLinks List,
        Microsoft.Network VirtualNetworkLinks Update,
        Microsoft.Network VirtualNetworkLinks Delete,
      ]
    note: The benchmark's oracle (ta.py private-dns-vnet-links); samples network private-dns link vnet create.
    setup:
      - group create --name {rg} --location {location}
      - network vnet create --name {name:vnet} --resource-group {rg} --address-prefixes 10.15.0.0/16
      - network private-dns zone create --resource-group {rg} --name {id}.l2.internal
      - >-
        network private-dns link vnet create --resource-group {rg} --zone-name {id}.l2.internal
        --name link1 --virtual-network {name:vnet} --registration-enabled false
      - run: network private-dns link vnet show --resource-group {rg} --zone-name {id}.l2.internal --name link1
        until: { json: { path: registrationEnabled, equals: false } }
      - >-
        network private-dns link vnet update --resource-group {rg} --zone-name {id}.l2.internal
        --name link1 --tags matrix=l2
      - >-
        network private-dns link vnet create --resource-group {rg} --zone-name {id}.l2.internal
        --name link2 --virtual-network {name:vnet} --registration-enabled false
      - network private-dns link vnet delete --resource-group {rg} --zone-name {id}.l2.internal --name link2 --yes
    command: network private-dns link vnet list --resource-group {rg} --zone-name {id}.l2.internal --query "[].name"
    expect:
