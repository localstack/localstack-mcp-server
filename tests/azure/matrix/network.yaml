    setup:
      - group create --name {rg} --location {location}
      - network public-ip create --name {name:pip} --resource-group {rg} --sku Standard
      - run: network public-ip list --resource-group {rg} --query "[].name"
        until: { json: { path: "", equals: ["{name:pip}"] } }
      - network public-ip list --query "[?name=='{name:pip}'].name"
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/publicIPAddresses/{name:pip}?api-version=2023-09-01
        --body '{"tags": {"matrix": "l2"}}'
    command: network public-ip delete --name {name:pip} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-public-ip-prefix
    operations:
      [
        Microsoft.Network PublicIpPrefixes CreateOrUpdate,
        Microsoft.Network PublicIpPrefixes Get,
        Microsoft.Network PublicIpPrefixes List,
        Microsoft.Network PublicIpPrefixes ListAll,
        Microsoft.Network PublicIpPrefixes UpdateTags,
        Microsoft.Network PublicIpPrefixes Delete,
