  # --- Private endpoints (samples network private-endpoint create/list/show, dns-zone-group) ---

  - id: network-private-endpoint
    operations:
      [
        Microsoft.Network PrivateEndpoints CreateOrUpdate,
        Microsoft.Network PrivateEndpoints Get,
        Microsoft.Network PrivateEndpoints List,
        Microsoft.Network PrivateEndpoints ListBySubscription,
      ]
    note: A private endpoint to a key vault (no side-car behind it).
    setup:
      - group create --name {rg} --location {location}
      - >-
        network vnet create --name {name:vnet} --resource-group {rg} --address-prefixes 10.16.0.0/16
        --subnet-name endpoints --subnet-prefixes 10.16.1.0/24
      - run: keyvault create --name {vault} --resource-group {rg} --location {location} --query id -o tsv
        capture: vault_id
      - >-
        network private-endpoint create --name {name:pe} --resource-group {rg} --vnet-name {name:vnet}
        --subnet endpoints --private-connection-resource-id {vault_id} --group-id vault --connection-name kv
      - run: network private-endpoint show --name {name:pe} --resource-group {rg} --query "privateLinkServiceConnections[0].groupIds"
        until: { json: { path: "", equals: [vault] } }
      - network private-endpoint list --query "[?name=='{name:pe}'].name"
    command: network private-endpoint list --resource-group {rg} --query "[].name"
    expect:
      json: { path: "", equals: ["{name:pe}"] }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: network-private-endpoint-dns-zone-group
    operations:
      [
        Microsoft.Network PrivateDnsZoneGroups CreateOrUpdate,
        Microsoft.Network PrivateDnsZoneGroups Get,
        Microsoft.Network PrivateDnsZoneGroups List,
        Microsoft.Network PrivateDnsZoneGroups Delete,
        Microsoft.Network PrivateEndpoints Delete,
      ]
    note: The benchmark's oracle (ta.py dns-zone-group); samples network private-endpoint dns-zone-group create.
    setup:
      - group create --name {rg} --location {location}
      - >-
        network vnet create --name {name:vnet} --resource-group {rg} --address-prefixes 10.17.0.0/16
        --subnet-name endpoints --subnet-prefixes 10.17.1.0/24
      - run: keyvault create --name {vault} --resource-group {rg} --location {location} --query id -o tsv
        capture: vault_id
      - run: network private-dns zone create --resource-group {rg} --name privatelink.vaultcore.azure.net --query id -o tsv
        capture: zone_id
      - >-
        network private-endpoint create --name {name:pe} --resource-group {rg} --vnet-name {name:vnet}
        --subnet endpoints --private-connection-resource-id {vault_id} --group-id vault --connection-name kv
      - >-
        network private-endpoint dns-zone-group create --endpoint-name {name:pe} --resource-group {rg}
        --name default --private-dns-zone {zone_id} --zone-name vault
      - run: network private-endpoint dns-zone-group show --endpoint-name {name:pe} --resource-group {rg} --name default
        until: { json: { path: name, equals: default } }
      - run: network private-endpoint dns-zone-group list --endpoint-name {name:pe} --resource-group {rg} --query "[].name"
        until: { json: { path: "", equals: [default] } }
      - network private-endpoint dns-zone-group delete --endpoint-name {name:pe} --resource-group {rg} --name default
    command: network private-endpoint delete --name {name:pe} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: network-private-link-service
    operations:
      [
        Microsoft.Network PrivateLinkServices CreateOrUpdate,
        Microsoft.Network PrivateLinkServices Get,
        Microsoft.Network PrivateLinkServices List,
        Microsoft.Network PrivateLinkServices ListBySubscription,
        Microsoft.Network PrivateLinkServices ListPrivateEndpointConnections,
        Microsoft.Network PrivateLinkServices Delete,
      ]
    setup:
      - group create --name {rg} --location {location}
      - >-
        network vnet create --name {name:vnet} --resource-group {rg} --address-prefixes 10.18.0.0/16
        --subnet-name pls --subnet-prefixes 10.18.1.0/24
      - network vnet subnet update --vnet-name {name:vnet} --resource-group {rg} --name pls --private-link-service-network-policies Disabled
      - >-
        network lb create --name {name:lb} --resource-group {rg} --sku Standard --vnet-name {name:vnet}
        --subnet pls --frontend-ip-name fe --backend-pool-name be
      # The frontend's own id (frontendIPConfigurations); see network-pls-frontend-by-name.
      - run: network lb show --name {name:lb} --resource-group {rg} --query "frontendIPConfigurations[0].id" -o tsv
        capture: fe_id
      - >-
        network private-link-service create --name {name:pls} --resource-group {rg} --vnet-name {name:vnet}
        --subnet pls --lb-frontend-ip-configs {fe_id}
      - run: network private-link-service show --name {name:pls} --resource-group {rg} --query name -o tsv
        until: { stdout: { equals: "{name:pls}" } }
      - network private-link-service list --resource-group {rg}
      - network private-link-service list --query "[?name=='{name:pls}'].name"
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/privateLinkServices/{name:pls}/privateEndpointConnections?api-version=2023-09-01
    command: network private-link-service delete --name {name:pls} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-pls-connection
    operations:
      [
        Microsoft.Network PrivateLinkServices GetPrivateEndpointConnection,
        Microsoft.Network PrivateLinkServices UpdatePrivateEndpointConnection,
        Microsoft.Network PrivateLinkServices DeletePrivateEndpointConnection,
      ]
    note: The benchmark's oracle (ta.py private-endpoint-create) targets a link service the same way.
    setup:
      - group create --name {rg} --location {location}
      - >-
        network vnet create --name {name:vnet} --resource-group {rg} --address-prefixes 10.19.0.0/16
        --subnet-name pls --subnet-prefixes 10.19.1.0/24
      - network vnet subnet update --vnet-name {name:vnet} --resource-group {rg} --name pls --private-link-service-network-policies Disabled
      - network vnet subnet create --vnet-name {name:vnet} --resource-group {rg} --name endpoints --address-prefixes 10.19.2.0/24
      - >-
        network lb create --name {name:lb} --resource-group {rg} --sku Standard --vnet-name {name:vnet}
        --subnet pls --frontend-ip-name fe --backend-pool-name be
      - run: network lb show --name {name:lb} --resource-group {rg} --query "frontendIPConfigurations[0].id" -o tsv
        capture: fe_id
      - run: >-
          network private-link-service create --name {name:pls} --resource-group {rg} --vnet-name {name:vnet}
          --subnet pls --lb-frontend-ip-configs {fe_id} --query id -o tsv
        capture: pls_id
      - >-
        network private-endpoint create --name {name:pe} --resource-group {rg} --vnet-name {name:vnet}
        --subnet endpoints --private-connection-resource-id {pls_id} --connection-name conn
    command: network private-link-service show --name {name:pls} --resource-group {rg} --query "privateEndpointConnections[].name"
    expect:
      json: { path: "", length: 1 }
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        Typed server COVERAGE_SKIPS: creating a private endpoint to a private link service never
        registers a private-endpoint connection on the service (private_endpoints__create_or_update
        does not add one), so the service-side Get, Update and Delete of the connection have nothing
        to act on.
      date: 2026-09-27

  - id: network-pls-frontend-by-name
    operations: [Microsoft.Network PrivateLinkServices CreateOrUpdate]
    note: >-
      The CLI's documented form (--lb-name with the frontend's name) builds the id with
      `frontendIpConfigurations`; the load balancer stores `frontendIPConfigurations`.
    setup:
      - group create --name {rg} --location {location}
      - >-
        network vnet create --name {name:vnet} --resource-group {rg} --address-prefixes 10.23.0.0/16
        --subnet-name pls --subnet-prefixes 10.23.1.0/24
      - network vnet subnet update --vnet-name {name:vnet} --resource-group {rg} --name pls --private-link-service-network-policies Disabled
      - >-
        network lb create --name {name:lb} --resource-group {rg} --sku Standard --vnet-name {name:vnet}
        --subnet pls --frontend-ip-name fe --backend-pool-name be
    command: >-
      network private-link-service create --name {name:pls} --resource-group {rg} --vnet-name {name:vnet}
      --subnet pls --lb-name {name:lb} --lb-frontend-ip-configs fe --query name -o tsv
    expect:
      stdout: { equals: "{name:pls}" }
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        L2: the emulator matches the frontend IP configuration id case-sensitively, so the id the CLI
        builds (`.../frontendIpConfigurations/fe`) answers 400 InvalidResourceReference "was not
        found" although the configuration exists as `.../frontendIPConfigurations/fe`; Azure
        resource ids are case-insensitive. The same create with the stored id succeeds.
      date: 2026-09-27

