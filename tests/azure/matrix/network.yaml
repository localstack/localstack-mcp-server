# Microsoft.Network: virtual networks, NSGs, public IPs, NAT, routes, NICs, load balancers,
# private DNS, private endpoints and link services, bastion, classic Front Door and the network
# experiment (Traffic Manager analytics) resources.
# UpdateTags operations are PATCH calls that no az verb maps to one to one (`update` is a GET then
# a PUT), so they go through `rest` with a relative URL.
# R.1: the typed server's three PrivateLinkServices private-endpoint-connection skips are one
# known gap here (network-pls-connection): a private endpoint to a link service never registers a
# connection on the service.
provider: Microsoft.Network
cases:
  - id: network-vnet-create
    operations:
      [Microsoft.Network VirtualNetworks CreateOrUpdate, Microsoft.Network Subnets CreateOrUpdate]
    pr: true
    setup:
      - group create --name {rg} --location {location}
    command: >-
      network vnet create --name {name:vnet} --resource-group {rg} --location {location}
      --address-prefixes 10.10.0.0/16 --subnet-name default --subnet-prefixes 10.10.1.0/24
    expect:
      json:
        - { path: newVNet.provisioningState, equals: Succeeded }
        - { path: "newVNet.addressSpace.addressPrefixes[0]", equals: 10.10.0.0/16 }
        - { path: "newVNet.subnets[0].name", equals: default }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-vnet-read
    operations:
      [
        Microsoft.Network VirtualNetworks Get,
        Microsoft.Network VirtualNetworks List,
        Microsoft.Network VirtualNetworks ListAll,
        Microsoft.Network VirtualNetworks UpdateTags,
      ]
    note: The benchmark's oracle (ta.py vnet-address-space); samples network vnet show.
    setup:
      - group create --name {rg} --location {location}
      - network vnet create --name {name:vnet} --resource-group {rg} --address-prefixes 10.11.0.0/16
      - run: network vnet show --name {name:vnet} --resource-group {rg} --query "addressSpace.addressPrefixes"
        until: { json: { path: "", equals: [10.11.0.0/16] } }
      - run: network vnet list --resource-group {rg} --query "[].name"
        until: { json: { path: "", equals: ["{name:vnet}"] } }
      - run: network vnet list --query "[?name=='{name:vnet}'].resourceGroup"
        until: { json: { path: "", equals: ["{rg}"] } }
    command: >-
      rest --method patch
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/virtualNetworks/{name:vnet}?api-version=2023-09-01
      --body '{"tags": {"matrix": "l2"}}'
    expect:
      json: { path: tags.matrix, equals: l2 }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-subnet
    operations:
      [
        Microsoft.Network Subnets CreateOrUpdate,
        Microsoft.Network Subnets Get,
        Microsoft.Network Subnets List,
        Microsoft.Network Subnets Delete,
      ]
    pr: true
    note: Samples network vnet subnet create/show/update.
    setup:
      - group create --name {rg} --location {location}
      - network vnet create --name {name:vnet} --resource-group {rg} --address-prefixes 10.12.0.0/16
      - >-
        network vnet subnet create --vnet-name {name:vnet} --resource-group {rg} --name app
        --address-prefixes 10.12.2.0/24
      - >-
        network vnet subnet create --vnet-name {name:vnet} --resource-group {rg} --name data
        --address-prefixes 10.12.3.0/24
      - run: network vnet subnet show --vnet-name {name:vnet} --resource-group {rg} --name app --query addressPrefix -o tsv
        until: { stdout: { equals: 10.12.2.0/24 } }
      - network vnet subnet delete --vnet-name {name:vnet} --resource-group {rg} --name data
    command: network vnet subnet list --vnet-name {name:vnet} --resource-group {rg} --query "[].name"
    expect:
      json: { path: "", equals: [app] }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-vnet-delete
    operations: [Microsoft.Network VirtualNetworks Delete]
    setup:
      - group create --name {rg} --location {location}
      - network vnet create --name {name:vnet} --resource-group {rg} --address-prefixes 10.13.0.0/16
    command: network vnet delete --name {name:vnet} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-nsg-rules
    operations:
      [
        Microsoft.Network NetworkSecurityGroups CreateOrUpdate,
        Microsoft.Network SecurityRules CreateOrUpdate,
        Microsoft.Network SecurityRules List,
      ]
    pr: true
    note: Samples network nsg create/show.
    setup:
      - group create --name {rg} --location {location}
      - network nsg create --name {name:nsg} --resource-group {rg} --location {location}
      - >-
        network nsg rule create --nsg-name {name:nsg} --resource-group {rg} --name allow-https
        --priority 100 --direction Inbound --access Allow --protocol Tcp --destination-port-ranges 443
    command: network nsg rule list --nsg-name {name:nsg} --resource-group {rg} --query "[].name"
    expect:
      json: { path: "", equals: [allow-https] }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-nsg-read-delete
    operations:
      [
        Microsoft.Network NetworkSecurityGroups Get,
        Microsoft.Network NetworkSecurityGroups List,
        Microsoft.Network NetworkSecurityGroups ListAll,
        Microsoft.Network NetworkSecurityGroups UpdateTags,
        Microsoft.Network NetworkSecurityGroups Delete,
        Microsoft.Network SecurityRules Get,
        Microsoft.Network SecurityRules Delete,
      ]
    setup:
      - group create --name {rg} --location {location}
      - network nsg create --name {name:nsg} --resource-group {rg} --location {location}
      - >-
        network nsg rule create --nsg-name {name:nsg} --resource-group {rg} --name deny-ssh
        --priority 200 --access Deny --protocol Tcp --destination-port-ranges 22
      - run: network nsg rule show --nsg-name {name:nsg} --resource-group {rg} --name deny-ssh --query access -o tsv
        until: { stdout: { equals: Deny } }
      - network nsg rule delete --nsg-name {name:nsg} --resource-group {rg} --name deny-ssh
      - run: network nsg show --name {name:nsg} --resource-group {rg} --query "securityRules[].name"
        until: { json: { path: "", length: 0 } }
      - run: network nsg list --resource-group {rg} --query "[].name"
        until: { json: { path: "", equals: ["{name:nsg}"] } }
      - network nsg list --query "[?name=='{name:nsg}'].name"
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/networkSecurityGroups/{name:nsg}?api-version=2023-09-01
        --body '{"tags": {"matrix": "l2"}}'
    command: network nsg delete --name {name:nsg} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: network-public-ip
    operations:
