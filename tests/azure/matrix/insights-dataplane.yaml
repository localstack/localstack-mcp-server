# Microsoft.Insights.DataPlane: the Application Insights query, events and metrics APIs, through
# the curated application-insights extension. Ingestion stores nothing, so these cases only
# check that the calls answer. On 2026-09-27 they do not reach the emulator at all: the cloud the tool registers
# (src/lib/azure/bootstrap.ts cloudConfigJson) sets no Application Insights endpoint, so the
# extension targets api.applicationinsights.io, and the egress guard refuses it (nothing leaks).
# The three cases are known gaps until the cloud config maps that endpoint; their refusals are
# excluded from the matrix's egress gate because they are the documented failure.
provider: Microsoft.Insights.DataPlane
cases:
  - id: appinsights-query
    operations: [Microsoft.Insights.DataPlane Query Execute]
    setup:
      - group create --name {rg} --location {location}
      - >-
        monitor app-insights component create --app {name:ai} --resource-group {rg} --location {location}
        --kind web --application-type web
    command: monitor app-insights query --app {name:ai} --resource-group {rg} --analytics-query "requests | count"
    expect:
      json: { path: tables, exists: true }
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        Found by L2 (tool configuration, not the emulator): the tool's registered cloud has no
        Application Insights endpoint, so the extension calls api.applicationinsights.io and the
        egress guard refuses it (class egress-refused).
      date: 2026-09-27

  - id: appinsights-events
    operations: [Microsoft.Insights.DataPlane Events GetByType]
    setup:
      - group create --name {rg} --location {location}
      - run: >-
          monitor app-insights component create --app {name:ai} --resource-group {rg} --location {location}
          --kind web --application-type web --query appId -o tsv
        capture: app_id
    command: monitor app-insights events show --app {app_id} --type requests
    expect:
      json: { path: value, exists: true }
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        Found by L2 (tool configuration, not the emulator): as appinsights-query, the events call
        goes to api.applicationinsights.io and is refused by the egress guard.
      date: 2026-09-27

  - id: appinsights-metrics
    operations: [Microsoft.Insights.DataPlane Metrics Get]
    setup:
      - group create --name {rg} --location {location}
      - >-
        monitor app-insights component create --app {name:ai} --resource-group {rg} --location {location}
        --kind web --application-type web
    command: monitor app-insights metrics show --app {name:ai} --resource-group {rg} --metrics requests/count
    expect:
      json: { path: value, exists: true }
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        Found by L2 (tool configuration, not the emulator): as appinsights-query, the metrics call
        goes to api.applicationinsights.io and is refused by the egress guard.
      date: 2026-09-27
