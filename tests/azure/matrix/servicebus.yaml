# Microsoft.ServiceBus: namespaces, queues, topics, subscriptions, rules, authorization rules.
# Namespace names use {name:sbns}: Azure (and the emulator, 400 NamespaceUnavailable InvalidName)
# refuses a namespace name that ends in -sb or -mgmt.
provider: Microsoft.ServiceBus
cases:
  - id: servicebus-namespace-queue
    operations:
      [Microsoft.ServiceBus Namespaces CreateOrUpdate, Microsoft.ServiceBus Queues CreateOrUpdate]
    pr: true
    note: Samples servicebus namespace create, servicebus queue create.
    setup:
      - group create --name {rg} --location {location}
      - servicebus namespace create --name {name:sbns} --resource-group {rg} --location {location} --sku Standard
    command: >-
      servicebus queue create --name orders --namespace-name {name:sbns} --resource-group {rg}
      --max-delivery-count 7 --lock-duration PT45S
    expect:
      json:
        - { path: name, equals: orders }
        - { path: maxDeliveryCount, equals: 7 }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: servicebus-namespace-read
    operations:
      [
        Microsoft.ServiceBus Namespaces Get,
        Microsoft.ServiceBus Namespaces ListByResourceGroup,
        Microsoft.ServiceBus Namespaces List,
        Microsoft.ServiceBus Namespaces CheckNameAvailability,
      ]
    note: Samples servicebus namespace show.
    setup:
      - group create --name {rg} --location {location}
      - servicebus namespace create --name {name:sbns} --resource-group {rg} --location {location} --sku Standard
      - run: servicebus namespace show --name {name:sbns} --resource-group {rg} --query serviceBusEndpoint -o tsv
        until: { stdout: { contains: "{name:sbns}" } }
      - run: servicebus namespace list --resource-group {rg} --query "[].name"
        until: { json: { path: "", equals: ["{name:sbns}"] } }
      - servicebus namespace list --query "[?name=='{name:sbns}'].name"
    command: servicebus namespace exists --name {name:sbns}
    expect:
      json: { path: nameAvailable, equals: false }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: servicebus-namespace-update-delete
    operations: [Microsoft.ServiceBus Namespaces Update, Microsoft.ServiceBus Namespaces Delete]
    note: The case upgrades the sku.
    setup:
      - group create --name {rg} --location {location}
      - servicebus namespace create --name {name:sbns} --resource-group {rg} --location {location} --sku Standard
      - run: servicebus namespace update --name {name:sbns} --resource-group {rg} --tags matrix=l2
        until: { json: { path: tags.matrix, equals: l2 } }
    command: servicebus namespace delete --name {name:sbns} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: servicebus-namespace-auth-rules
    operations:
      [
        Microsoft.ServiceBus Namespaces CreateOrUpdateAuthorizationRule,
        Microsoft.ServiceBus Namespaces GetAuthorizationRule,
        Microsoft.ServiceBus Namespaces ListAuthorizationRules,
        Microsoft.ServiceBus Namespaces ListKeys,
        Microsoft.ServiceBus Namespaces RegenerateKeys,
        Microsoft.ServiceBus Namespaces DeleteAuthorizationRule,
      ]
    note: Samples servicebus namespace authorization-rule keys list.
    setup:
      - group create --name {rg} --location {location}
      - servicebus namespace create --name {name:sbns} --resource-group {rg} --location {location} --sku Standard
      - >-
        servicebus namespace authorization-rule create --namespace-name {name:sbns} --resource-group {rg}
        --name sender --rights Send
      - run: servicebus namespace authorization-rule show --namespace-name {name:sbns} --resource-group {rg} --name sender
        until: { json: { path: rights, equals: [Send] } }
      - servicebus namespace authorization-rule list --namespace-name {name:sbns} --resource-group {rg}
      - >-
        servicebus namespace authorization-rule keys renew --namespace-name {name:sbns} --resource-group {rg}
        --name sender --key PrimaryKey
      - run: >-
          servicebus namespace authorization-rule keys list --namespace-name {name:sbns} --resource-group {rg}
          --name RootManageSharedAccessKey --query primaryConnectionString -o tsv
        until: { stdout: { contains: "SharedAccessKeyName=RootManageSharedAccessKey" } }
    command: >-
      servicebus namespace authorization-rule delete --namespace-name {name:sbns} --resource-group {rg}
      --name sender
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: servicebus-network-rules
    operations:
      [
        Microsoft.ServiceBus Namespaces CreateOrUpdateNetworkRuleSet,
        Microsoft.ServiceBus Namespaces GetNetworkRuleSet,
        Microsoft.ServiceBus Namespaces ListNetworkRuleSets,
        Microsoft.ServiceBus DisasterRecoveryConfigs List,
      ]
    setup:
      - group create --name {rg} --location {location}
      - servicebus namespace create --name {name:sbns} --resource-group {rg} --location {location} --sku Premium
      # Answers 0 but the rule is not stored (servicebus-network-rules-applied).
      - >-
        servicebus namespace network-rule-set ip-rule add --namespace-name {name:sbns} --resource-group {rg}
        --ip-rule ip-address=10.1.1.1 action=Allow
      - run: servicebus namespace network-rule-set show --namespace-name {name:sbns} --resource-group {rg} --query name -o tsv
        until: { stdout: { equals: default } }
      - servicebus namespace network-rule-set list --namespace-name {name:sbns} --resource-group {rg}
    command: servicebus georecovery-alias list --namespace-name {name:sbns} --resource-group {rg}
    expect:
      json: { path: "", length: 0 }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: servicebus-network-rules-applied
    operations: [Microsoft.ServiceBus Namespaces CreateOrUpdateNetworkRuleSet]
    setup:
      - group create --name {rg} --location {location}
      - servicebus namespace create --name {name:sbns} --resource-group {rg} --location {location} --sku Premium
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ServiceBus/namespaces/{name:sbns}/networkRuleSets/default?api-version=2021-11-01
        --body '{"properties": {"defaultAction": "Deny", "ipRules": [{"ipMask": "10.2.2.2", "action": "Allow"}]}}'
    command: >-
      rest --method get
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ServiceBus/namespaces/{name:sbns}/networkRuleSets/default?api-version=2021-11-01
    expect:
      json:
        - { path: properties.defaultAction, equals: Deny }
        - { path: "properties.ipRules[0].ipMask", equals: 10.2.2.2 }
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        L2: CreateOrUpdateNetworkRuleSet answers 200 but stores nothing: defaultAction stays Allow
        and ipRules stay empty, from a REST PUT and from `network-rule-set ip-rule add` alike.
      date: 2026-09-27

  - id: servicebus-queue-read-delete
    operations:
      [
        Microsoft.ServiceBus Queues Get,
        Microsoft.ServiceBus Queues ListByNamespace,
        Microsoft.ServiceBus Queues Delete,
      ]
    note: Samples servicebus queue show/list.
    setup:
      - group create --name {rg} --location {location}
      - servicebus namespace create --name {name:sbns} --resource-group {rg} --location {location} --sku Standard
      - servicebus queue create --name orders --namespace-name {name:sbns} --resource-group {rg}
      - servicebus queue create --name old --namespace-name {name:sbns} --resource-group {rg}
      - run: servicebus queue show --name orders --namespace-name {name:sbns} --resource-group {rg} --query status -o tsv
        until: { stdout: { equals: Active } }
      - servicebus queue delete --name old --namespace-name {name:sbns} --resource-group {rg}
    command: servicebus queue list --namespace-name {name:sbns} --resource-group {rg} --query "[].name"
    expect:
      json: { path: "", equals: [orders] }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: servicebus-queue-auth-rules
    operations:
      [
        Microsoft.ServiceBus Queues CreateOrUpdateAuthorizationRule,
        Microsoft.ServiceBus Queues GetAuthorizationRule,
        Microsoft.ServiceBus Queues ListAuthorizationRules,
        Microsoft.ServiceBus Queues ListKeys,
        Microsoft.ServiceBus Queues RegenerateKeys,
        Microsoft.ServiceBus Queues DeleteAuthorizationRule,
      ]
    setup:
      - group create --name {rg} --location {location}
      - servicebus namespace create --name {name:sbns} --resource-group {rg} --location {location} --sku Standard
      - servicebus queue create --name orders --namespace-name {name:sbns} --resource-group {rg}
      - >-
        servicebus queue authorization-rule create --queue-name orders --namespace-name {name:sbns}
        --resource-group {rg} --name listener --rights Listen
      - servicebus queue authorization-rule show --queue-name orders --namespace-name {name:sbns} --resource-group {rg} --name listener
      - servicebus queue authorization-rule list --queue-name orders --namespace-name {name:sbns} --resource-group {rg}
      - run: >-
          servicebus queue authorization-rule keys list --queue-name orders --namespace-name {name:sbns}
          --resource-group {rg} --name listener --query primaryKey -o tsv
        capture: key_before
      - >-
        servicebus queue authorization-rule keys renew --queue-name orders --namespace-name {name:sbns}
        --resource-group {rg} --name listener --key PrimaryKey
    command: >-
      servicebus queue authorization-rule delete --queue-name orders --namespace-name {name:sbns}
      --resource-group {rg} --name listener
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: servicebus-topic-subscriptions
    operations:
      [
        Microsoft.ServiceBus Topics CreateOrUpdate,
        Microsoft.ServiceBus Subscriptions CreateOrUpdate,
        Microsoft.ServiceBus Subscriptions ListByTopic,
      ]
    pr: true
    setup:
      - group create --name {rg} --location {location}
      - servicebus namespace create --name {name:sbns} --resource-group {rg} --location {location} --sku Standard
      - servicebus topic create --name events --namespace-name {name:sbns} --resource-group {rg}
      - servicebus topic subscription create --name audit --topic-name events --namespace-name {name:sbns} --resource-group {rg}
      - servicebus topic subscription create --name billing --topic-name events --namespace-name {name:sbns} --resource-group {rg}
    command: >-
      servicebus topic subscription list --topic-name events --namespace-name {name:sbns}
      --resource-group {rg} --query "sort([].name)"
    expect:
      json: { path: "", equals: [audit, billing] }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: servicebus-topic-read-delete
    operations:
      [
        Microsoft.ServiceBus Topics Get,
        Microsoft.ServiceBus Topics ListByNamespace,
        Microsoft.ServiceBus Topics Delete,
        Microsoft.ServiceBus Subscriptions Get,
        Microsoft.ServiceBus Subscriptions Delete,
      ]
    setup:
      - group create --name {rg} --location {location}
      - servicebus namespace create --name {name:sbns} --resource-group {rg} --location {location} --sku Standard
      - servicebus topic create --name events --namespace-name {name:sbns} --resource-group {rg}
      - >-
        servicebus topic subscription create --name audit --topic-name events --namespace-name {name:sbns}
        --resource-group {rg} --max-delivery-count 3
      - run: >-
          servicebus topic subscription show --name audit --topic-name events --namespace-name {name:sbns}
          --resource-group {rg} --query maxDeliveryCount
        until: { json: { path: "", equals: 3 } }
      - servicebus topic subscription delete --name audit --topic-name events --namespace-name {name:sbns} --resource-group {rg}
      - run: servicebus topic show --name events --namespace-name {name:sbns} --resource-group {rg} --query name -o tsv
        until: { stdout: { equals: events } }
      - servicebus topic list --namespace-name {name:sbns} --resource-group {rg}
    command: servicebus topic delete --name events --namespace-name {name:sbns} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: servicebus-topic-auth-rules
    operations:
      [
        Microsoft.ServiceBus Topics CreateOrUpdateAuthorizationRule,
        Microsoft.ServiceBus Topics GetAuthorizationRule,
        Microsoft.ServiceBus Topics ListAuthorizationRules,
        Microsoft.ServiceBus Topics ListKeys,
        Microsoft.ServiceBus Topics RegenerateKeys,
        Microsoft.ServiceBus Topics DeleteAuthorizationRule,
      ]
    setup:
      - group create --name {rg} --location {location}
      - servicebus namespace create --name {name:sbns} --resource-group {rg} --location {location} --sku Standard
      - servicebus topic create --name events --namespace-name {name:sbns} --resource-group {rg}
      - >-
        servicebus topic authorization-rule create --topic-name events --namespace-name {name:sbns}
        --resource-group {rg} --name publisher --rights Send
      - servicebus topic authorization-rule show --topic-name events --namespace-name {name:sbns} --resource-group {rg} --name publisher
      - run: >-
          servicebus topic authorization-rule list --topic-name events --namespace-name {name:sbns}
          --resource-group {rg} --query "[].name"
        until: { json: { path: "", contains: publisher } }
      - servicebus topic authorization-rule keys list --topic-name events --namespace-name {name:sbns} --resource-group {rg} --name publisher
      - >-
        servicebus topic authorization-rule keys renew --topic-name events --namespace-name {name:sbns}
        --resource-group {rg} --name publisher --key SecondaryKey
    command: >-
      servicebus topic authorization-rule delete --topic-name events --namespace-name {name:sbns}
      --resource-group {rg} --name publisher
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: servicebus-rules
    operations:
      [
        Microsoft.ServiceBus Rules CreateOrUpdate,
        Microsoft.ServiceBus Rules Get,
        Microsoft.ServiceBus Rules ListBySubscriptions,
        Microsoft.ServiceBus Rules Delete,
      ]
    setup:
      - group create --name {rg} --location {location}
      - servicebus namespace create --name {name:sbns} --resource-group {rg} --location {location} --sku Standard
      - servicebus topic create --name events --namespace-name {name:sbns} --resource-group {rg}
      - servicebus topic subscription create --name audit --topic-name events --namespace-name {name:sbns} --resource-group {rg}
      - >-
        servicebus topic subscription rule create --name high-priority --subscription-name audit
        --topic-name events --namespace-name {name:sbns} --resource-group {rg} --filter-sql-expression "priority > 5"
      - run: >-
          servicebus topic subscription rule show --name high-priority --subscription-name audit
          --topic-name events --namespace-name {name:sbns} --resource-group {rg} --query sqlFilter.sqlExpression -o tsv
        until: { stdout: { equals: "priority > 5" } }
      - run: >-
          servicebus topic subscription rule list --subscription-name audit --topic-name events
          --namespace-name {name:sbns} --resource-group {rg} --query "[].name"
        until: { json: { path: "", contains: high-priority } }
    command: >-
      servicebus topic subscription rule delete --name high-priority --subscription-name audit
      --topic-name events --namespace-name {name:sbns} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait
