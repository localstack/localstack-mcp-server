# Microsoft.Web: App Service plans, web apps, function apps. A site runs as a container on the
# emulator's Docker engine, so site cases are `backing: true`; plans and the catalogue calls are
# light. CI pins LS_AZURE_ORYX_BUILD_IMAGE_TO_USE (plan Appendix F); no case here deploys code.
# R.1: the typed server skipped nine operations. Six shared one root cause (the handlers
# dereferenced `WebApp.rules`, which the model lacked); the four function-trigger operations of
# that family passed live on 2026-09-27 (fixed upstream, webapp-function-triggers is a plain
# case), the rest are known gaps whose families are grouped, each case exercising one
# representative operation, named in its reason.
provider: Microsoft.Web
cases:
  - id: web-plan
    operations:
      [
        Microsoft.Web AppServicePlans CreateOrUpdate,
        Microsoft.Web AppServicePlans Get,
        Microsoft.Web AppServicePlans ListByResourceGroup,
        Microsoft.Web AppServicePlans List,
        Microsoft.Web AppServicePlans Delete,
      ]
    note: Samples appservice plan create/show; the benchmark's T-B webapp workflows.
    setup:
      - group create --name {rg} --location {location}
      - appservice plan create --name {name:plan} --resource-group {rg} --location {location} --sku B1 --is-linux
      - run: appservice plan show --name {name:plan} --resource-group {rg} --query sku.name -o tsv
        until: { stdout: { equals: B1 } }
      - appservice plan list --resource-group {rg}
      - appservice plan list --query "[?name=='{name:plan}'].name"
    command: appservice plan delete --name {name:plan} --resource-group {rg} --yes
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: web-catalogue
    operations:
      [
        Microsoft.Web Microsoft.Web CheckNameAvailability,
        Microsoft.Web Microsoft.Web ListGeoRegions,
        Microsoft.Web Provider GetWebAppStacks,
        Microsoft.Web Provider GetFunctionAppStacks,
      ]
    setup:
      - >-
        rest --method post --url /subscriptions/{sub}/providers/Microsoft.Web/checknameavailability?api-version=2024-04-01
        --body '{"name": "{name:web}", "type": "Microsoft.Web/sites"}'
      - appservice list-locations --sku B1 --linux-workers-enabled
      - webapp list-runtimes --os-type linux
    command: functionapp list-runtimes --os-type linux --query "length(@) > `0`"
    expect:
      json: { path: "", equals: true }

  - id: webapp-create
    operations: [Microsoft.Web WebApps CreateOrUpdate, Microsoft.Web WebApps Get]
    backing: true
    note: Samples webapp create/show; the benchmark's oracle (ta.py webapp-hostname).
    setup:
      - group create --name {rg} --location {location}
      - appservice plan create --name {name:plan} --resource-group {rg} --location {location} --sku B1 --is-linux
      - webapp create --name {name:web} --resource-group {rg} --plan {name:plan} --runtime PYTHON:3.12
    command: webapp show --name {name:web} --resource-group {rg}
    expect:
      json:
        - { path: state, equals: Running }
        - { path: defaultHostName, contains: "{name:web}" }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: webapp-lists-publishing
    operations:
      [
        Microsoft.Web WebApps ListByResourceGroup,
        Microsoft.Web WebApps List,
        Microsoft.Web WebApps ListInstanceIdentifiers,
        Microsoft.Web WebApps ListPublishingCredentials,
        Microsoft.Web WebApps ListPublishingProfileXmlWithSecrets,
        Microsoft.Web WebApps ListSlotConfigurationNames,
      ]
    backing: true
    note: Samples webapp list.
    setup:
      - group create --name {rg} --location {location}
      - appservice plan create --name {name:plan} --resource-group {rg} --location {location} --sku B1 --is-linux
      - webapp create --name {name:web} --resource-group {rg} --plan {name:plan} --runtime PYTHON:3.12
      - run: webapp list --resource-group {rg} --query "[].name"
        until: { json: { path: "", equals: ["{name:web}"] } }
      - webapp list --query "[?name=='{name:web}'].name"
      - webapp list-instances --name {name:web} --resource-group {rg}
      - webapp deployment list-publishing-credentials --name {name:web} --resource-group {rg}
      - webapp deployment list-publishing-profiles --name {name:web} --resource-group {rg} --xml
    command: >-
      rest --method get
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/config/slotConfigNames?api-version=2024-04-01
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: webapp-config-appsettings
    operations:
      [
        Microsoft.Web WebApps GetConfiguration,
        Microsoft.Web WebApps UpdateConfiguration,
        Microsoft.Web WebApps CreateOrUpdateConfiguration,
        Microsoft.Web WebApps ListApplicationSettings,
        Microsoft.Web WebApps UpdateApplicationSettings,
      ]
    backing: true
    note: Samples webapp config appsettings set (22 uses), webapp config set; tb.py webapp-settings.
    setup:
      - group create --name {rg} --location {location}
      - appservice plan create --name {name:plan} --resource-group {rg} --location {location} --sku B1 --is-linux
      - webapp create --name {name:web} --resource-group {rg} --plan {name:plan} --runtime PYTHON:3.12
      - webapp config appsettings set --name {name:web} --resource-group {rg} --settings FEATURE_FLAG=l2 MATRIX=on
      - run: webapp config appsettings list --name {name:web} --resource-group {rg} --query "[?name=='FEATURE_FLAG'].value"
        until: { json: { path: "", equals: [l2] } }
      - webapp config set --name {name:web} --resource-group {rg} --always-on false
      - webapp identity assign --name {name:web} --resource-group {rg}
      - run: webapp identity show --name {name:web} --resource-group {rg} --query type -o tsv
        until: { stdout: { contains: SystemAssigned } }
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/config/web?api-version=2024-04-01
        --body '{"properties": {"http20Enabled": true}}'
    command: webapp config show --name {name:web} --resource-group {rg} --query alwaysOn
    expect:
      json: { path: "", equals: false }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: webapp-logs-auth-storage
    operations:
      [
        Microsoft.Web WebApps GetDiagnosticLogsConfiguration,
        Microsoft.Web WebApps UpdateDiagnosticLogsConfig,
        Microsoft.Web WebApps GetAuthSettings,
        Microsoft.Web WebApps GetAuthSettingsV2,
        Microsoft.Web WebApps GetBackupConfiguration,
        Microsoft.Web WebApps ListAzureStorageAccounts,
        Microsoft.Web WebApps UpdateAzureStorageAccounts,
      ]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - appservice plan create --name {name:plan} --resource-group {rg} --location {location} --sku B1 --is-linux
      - webapp create --name {name:web} --resource-group {rg} --plan {name:plan} --runtime PYTHON:3.12
      - webapp log config --name {name:web} --resource-group {rg} --application-logging filesystem --level information
      - webapp log show --name {name:web} --resource-group {rg}
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/config/authsettings/list?api-version=2024-04-01
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/config/authsettingsV2/list?api-version=2024-04-01
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/config/backup/list?api-version=2024-04-01
      - >-
        webapp config storage-account add --name {name:web} --resource-group {rg} --custom-id share1
        --storage-type AzureFiles --account-name {storage} --share-name share1 --access-key a2V5 --mount-path /mnt/share
    command: webapp config storage-account list --name {name:web} --resource-group {rg} --query "[].name"
    expect:
      json: { path: "", equals: [share1] }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: webapp-ftp-scm-read
    operations: [Microsoft.Web WebApps GetFtpAllowed, Microsoft.Web WebApps GetScmAllowed]
    backing: true
    note: The benchmark's oracle (td.py td-webapp-ftp-allowed) reads the policy with rest.
    setup:
      - group create --name {rg} --location {location}
      - appservice plan create --name {name:plan} --resource-group {rg} --location {location} --sku B1 --is-linux
      - webapp create --name {name:web} --resource-group {rg} --plan {name:plan} --runtime PYTHON:3.12
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/basicPublishingCredentialsPolicies/ftp?api-version=2024-04-01
    command: >-
      rest --method get
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/basicPublishingCredentialsPolicies/scm?api-version=2024-04-01
    expect:
      json: { path: properties.allow, exists: true }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: webapp-source-control
    operations:
      [
        Microsoft.Web WebApps CreateOrUpdateSourceControl,
        Microsoft.Web WebApps GetSourceControl,
        Microsoft.Web WebApps SyncRepository,
        Microsoft.Web WebApps DeleteSourceControl,
      ]
    backing: true
    note: The benchmark's oracle (ta.py webapp-sync-repository, blocked because the sync records nothing).
    setup:
      - group create --name {rg} --location {location}
      - appservice plan create --name {name:plan} --resource-group {rg} --location {location} --sku B1 --is-linux
      - webapp create --name {name:web} --resource-group {rg} --plan {name:plan} --runtime PYTHON:3.12
      - >-
        webapp deployment source config --name {name:web} --resource-group {rg}
        --repo-url https://github.com/Azure-Samples/python-docs-hello-world --branch main --manual-integration
      - run: webapp deployment source show --name {name:web} --resource-group {rg} --query branch -o tsv
        until: { stdout: { equals: main } }
      - webapp deployment source sync --name {name:web} --resource-group {rg}
    command: webapp deployment source delete --name {name:web} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: webapp-deployments
    operations:
      [
        Microsoft.Web WebApps CreateDeployment,
        Microsoft.Web WebApps GetDeployment,
        Microsoft.Web WebApps ListDeployments,
        Microsoft.Web WebApps ListDeploymentLog,
        Microsoft.Web WebApps DeleteDeployment,
      ]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - appservice plan create --name {name:plan} --resource-group {rg} --location {location} --sku B1 --is-linux
      - webapp create --name {name:web} --resource-group {rg} --plan {name:plan} --runtime PYTHON:3.12
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/deployments/l2dep?api-version=2024-04-01
        --body '{"properties": {"status": 4, "message": "l2 matrix", "author": "l2", "deployer": "l2", "active": true}}'
      - run: >-
          rest --method get
          --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/deployments/l2dep?api-version=2024-04-01
        until: { json: { path: properties.message, equals: l2 matrix } }
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/deployments?api-version=2024-04-01
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/deployments/l2dep/log?api-version=2024-04-01
    command: >-
      rest --method delete
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/deployments/l2dep?api-version=2024-04-01
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: webapp-delete
    operations: [Microsoft.Web WebApps Delete]
    backing: true
    note: The benchmark's oracle (ta.py webapp-delete).
    setup:
      - group create --name {rg} --location {location}
      - appservice plan create --name {name:plan} --resource-group {rg} --location {location} --sku B1 --is-linux
      - webapp create --name {name:web} --resource-group {rg} --plan {name:plan} --runtime PYTHON:3.12
    command: webapp delete --name {name:web} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: functionapp-create
    operations:
      [
        Microsoft.Web WebApps CreateOrUpdate,
        Microsoft.Web WebApps SyncFunctionTriggers,
        Microsoft.Web WebApps SyncFunctions,
      ]
    backing: true
    note: >-
      Samples functionapp create (9 uses); the benchmark's oracle (td.py td-webapp-sync-functions)
      posted `.../syncfunctions`, which is not an ARM route (404 now): SyncFunctions is
      `.../host/default/sync`, SyncFunctionTriggers `.../syncfunctiontriggers`.
      --disable-app-insights: without it az fetches appinsights.azureedge.net (functionapp-create-app-insights).
    setup:
      - group create --name {rg} --location {location}
      - storage account create --name {storage} --resource-group {rg} --location {location} --sku Standard_LRS
      - >-
        functionapp create --name {name:func} --resource-group {rg} --storage-account {storage}
        --consumption-plan-location {location} --runtime python --runtime-version 3.11
        --functions-version 4 --os-type Linux --disable-app-insights true
      - run: functionapp show --name {name:func} --resource-group {rg} --query kind -o tsv
        until: { stdout: { contains: functionapp } }
      - functionapp list --resource-group {rg}
      - functionapp config appsettings set --name {name:func} --resource-group {rg} --settings MATRIX=l2
      - run: functionapp config appsettings list --name {name:func} --resource-group {rg} --query "[?name=='MATRIX'].value"
        until: { json: { path: "", equals: [l2] } }
      - functionapp identity assign --name {name:func} --resource-group {rg}
      - functionapp identity show --name {name:func} --resource-group {rg}
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:func}/syncfunctiontriggers?api-version=2024-04-01
    command: >-
      rest --method post
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:func}/host/default/sync?api-version=2024-04-01
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: functionapp-create-app-insights
    operations: [Microsoft.Web WebApps CreateOrUpdate]
    backing: true
    note: Tool behaviour, not the emulator; the case documents it and keeps the refusal out of the egress gate.
    setup:
      - group create --name {rg} --location {location}
      - storage account create --name {storage} --resource-group {rg} --location {location} --sku Standard_LRS
      - >-
        functionapp create --name {name:func} --resource-group {rg} --storage-account {storage}
        --consumption-plan-location {location} --runtime python --runtime-version 3.11
        --functions-version 4 --os-type Linux
    command: >-
      functionapp config appsettings list --name {name:func} --resource-group {rg}
      --query "[?name=='APPLICATIONINSIGHTS_CONNECTION_STRING'].name"
    expect:
      json: { path: "", equals: [APPLICATIONINSIGHTS_CONNECTION_STRING] }
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        The tool's egress guard, by design: without --workspace, `functionapp create` derives its
        default Log Analytics workspace from App Insights' region map at appinsights.azureedge.net,
        which the guard refuses (no leak). Since 2026-09-28 that host is a housekeeping block, so
        az carries on and the app is created, but without App Insights, hence no
        APPLICATIONINSIGHTS_CONNECTION_STRING. With --workspace the component is created
        (functionapp-create-app-insights-workspace).
      date: 2026-09-28

  - id: functionapp-create-app-insights-workspace
    operations: [Microsoft.Web WebApps CreateOrUpdate]
    backing: true
    note: >-
      With an existing Log Analytics workspace, az skips the region-map download and creates the
      App Insights component, wiring its connection string into the app (verified live 2026-09-28).
    setup:
      - group create --name {rg} --location {location}
      - storage account create --name {storage} --resource-group {rg} --location {location} --sku Standard_LRS
      - monitor log-analytics workspace create --resource-group {rg} --workspace-name {name:ws} --location {location}
      - >-
        functionapp create --name {name:func} --resource-group {rg} --storage-account {storage}
        --consumption-plan-location {location} --runtime python --runtime-version 3.11
        --functions-version 4 --os-type Linux --workspace {name:ws}
    command: >-
      functionapp config appsettings list --name {name:func} --resource-group {rg}
      --query "[?name=='APPLICATIONINSIGHTS_CONNECTION_STRING'].name"
    expect:
      json: { path: "", equals: [APPLICATIONINSIGHTS_CONNECTION_STRING] }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  # --- Known gaps (typed server COVERAGE_SKIPS) ---

  - id: webapp-connection-strings
    operations: [Microsoft.Web WebApps ListConnectionStrings]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - appservice plan create --name {name:plan} --resource-group {rg} --location {location} --sku B1 --is-linux
      - webapp create --name {name:web} --resource-group {rg} --plan {name:plan} --runtime PYTHON:3.12
    command: webapp config connection-string list --name {name:web} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        Typed server COVERAGE_SKIPS: the handler fails with AttributeError "'WebApp' object has no
        attribute 'rules'".
      date: 2026-09-27

  - id: webapp-ftp-scm-update
    operations: [Microsoft.Web WebApps UpdateFtpAllowed, Microsoft.Web WebApps UpdateScmAllowed]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - appservice plan create --name {name:plan} --resource-group {rg} --location {location} --sku B1 --is-linux
      - webapp create --name {name:web} --resource-group {rg} --plan {name:plan} --runtime PYTHON:3.12
    command: >-
      rest --method put
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/basicPublishingCredentialsPolicies/ftp?api-version=2024-04-01
      --body '{"properties": {"allow": false}}'
    expect:
      json: { path: properties.allow, equals: false }
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        Typed server COVERAGE_SKIPS: UpdateFtpAllowed and UpdateScmAllowed fail with the same
        AttributeError "'WebApp' object has no attribute 'rules'" (the case PUTs the ftp policy).
      date: 2026-09-27

  - id: webapp-update-source-control
    operations: [Microsoft.Web WebApps UpdateSourceControl]
    backing: true
    timeout: 90
    setup:
      - group create --name {rg} --location {location}
      - appservice plan create --name {name:plan} --resource-group {rg} --location {location} --sku B1 --is-linux
      - webapp create --name {name:web} --resource-group {rg} --plan {name:plan} --runtime PYTHON:3.12
    command: >-
      rest --method patch
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/sourcecontrols/web?api-version=2024-04-01
      --body '{"properties": {"branch": "dev"}}'
    expect:
      json: { path: properties.branch, equals: dev }
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        Typed server COVERAGE_SKIPS: the handler's AttributeError on 'WebApp.rules' hangs the proxy
        until the client's timeout (this case cancels it after 90 s).
      date: 2026-09-27

  - id: webapp-deployment-status
    operations: [Microsoft.Web WebApps GetProductionSiteDeploymentStatus]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - appservice plan create --name {name:plan} --resource-group {rg} --location {location} --sku B1 --is-linux
      - webapp create --name {name:web} --resource-group {rg} --plan {name:plan} --runtime PYTHON:3.12
    command: >-
      rest --method get
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/deploymentStatus/{uuid}?api-version=2024-04-01
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        Typed server COVERAGE_SKIPS: the emulator needs the operation id of a real zip-deploy LRO; any
        other id answers 404 "operation not found" (and no case here deploys code).
      date: 2026-09-27

  # R.1: the typed server skipped these four (AttributeError "'WebApp' object has no attribute
  # 'rules'"). ListFunctions passed live on 2026-09-27 and SyncFunctionTriggers passed in
  # functionapp-create (fixed upstream), so this is a plain case; the two list steps were added
  # after the local backing budget was spent, so their first live run is CI's.
  - id: webapp-function-triggers
    operations:
      [
        Microsoft.Web WebApps ListFunctions,
        Microsoft.Web WebApps SyncFunctionTriggers,
        Microsoft.Web WebApps ListSyncFunctionTriggers,
        Microsoft.Web WebApps ListSyncStatus,
      ]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - appservice plan create --name {name:plan} --resource-group {rg} --location {location} --sku B1 --is-linux
      - webapp create --name {name:web} --resource-group {rg} --plan {name:plan} --runtime PYTHON:3.12
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/syncfunctiontriggers?api-version=2024-04-01
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/listsyncfunctiontriggerstatus?api-version=2024-04-01
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/host/default/listsyncstatus?api-version=2024-04-01
    command: >-
      rest --method get
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{name:web}/functions?api-version=2024-04-01
    expect:
      json: { path: value, exists: true }
    cleanup:
      - group delete --name {rg} --yes --no-wait
