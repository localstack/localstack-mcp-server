# Microsoft.DBforMySQL: flexible servers, databases, firewall rules, parameters, backups. A server
# runs a real MySQL container (ls-mysql-flexible-*), so every server case is `backing: true`; the
# runner waits for the group's resources to settle before deleting (an early delete was seen to
# leave the container running).
provider: Microsoft.DBforMySQL
cases:
  - id: mysql-catalogue
    operations:
      [
        Microsoft.DBforMySQL LocationBasedCapabilities List,
        Microsoft.DBforMySQL CheckNameAvailability Execute,
        Microsoft.DBforMySQL CheckNameAvailabilityWithoutLocation Execute,
      ]
    setup:
      - mysql flexible-server list-skus --location {location} --query "length(@) > `0`"
      - >-
        rest --method post
        --url /subscriptions/{sub}/providers/Microsoft.DBforMySQL/locations/{location}/checkNameAvailability?api-version=2023-12-30
        --body '{"name": "{name:my}", "type": "Microsoft.DBforMySQL/flexibleServers"}'
    command: >-
      rest --method post
      --url /subscriptions/{sub}/providers/Microsoft.DBforMySQL/checkNameAvailability?api-version=2023-12-30
      --body '{"name": "{name:my}", "type": "Microsoft.DBforMySQL/flexibleServers"}'
    expect:
      json: { path: nameAvailable, equals: true }

  - id: mysql-server
    operations:
      [
        Microsoft.DBforMySQL FlexibleServers Servers_Create,
        Microsoft.DBforMySQL FlexibleServers Servers_Get,
        Microsoft.DBforMySQL FlexibleServers Servers_ListByResourceGroup,
        Microsoft.DBforMySQL FlexibleServers Servers_List,
        Microsoft.DBforMySQL FlexibleServers Servers_Update,
      ]
    backing: true
    note: Samples mysql flexible-server create/show.
    setup:
      - group create --name {rg} --location {location}
      - >-
        mysql flexible-server create --name {name:my} --resource-group {rg} --location {location}
        --tier Burstable --sku-name Standard_B1ms --admin-user myadmin --admin-password LocalStack123!
        --public-access None --yes
      - run: mysql flexible-server show --name {name:my} --resource-group {rg} --query state -o tsv
        until: { stdout: { equals: Ready } }
      - mysql flexible-server list --resource-group {rg}
      - mysql flexible-server list --query "[?name=='{name:my}'].name"
    command: mysql flexible-server update --name {name:my} --resource-group {rg} --tags matrix=l2
    expect:
      json: { path: tags.matrix, equals: l2 }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: mysql-databases-firewall
    operations:
      [
        Microsoft.DBforMySQL FlexibleServers Databases_CreateOrUpdate,
        Microsoft.DBforMySQL FlexibleServers Databases_Get,
        Microsoft.DBforMySQL FlexibleServers Databases_ListByServer,
        Microsoft.DBforMySQL FlexibleServers Databases_Delete,
        Microsoft.DBforMySQL FlexibleServers FirewallRules_CreateOrUpdate,
        Microsoft.DBforMySQL FlexibleServers FirewallRules_Get,
        Microsoft.DBforMySQL FlexibleServers FirewallRules_ListByServer,
        Microsoft.DBforMySQL FlexibleServers FirewallRules_Delete,
      ]
    backing: true
    note: Samples mysql flexible-server db/firewall-rule create.
    setup:
      - group create --name {rg} --location {location}
      - >-
        mysql flexible-server create --name {name:my} --resource-group {rg} --location {location}
        --tier Burstable --sku-name Standard_B1ms --admin-user myadmin --admin-password LocalStack123!
        --public-access None --yes
      - mysql flexible-server db create --server-name {name:my} --resource-group {rg} --database-name shop
      - mysql flexible-server db show --server-name {name:my} --resource-group {rg} --database-name shop
      - mysql flexible-server db list --server-name {name:my} --resource-group {rg}
      - >-
        mysql flexible-server firewall-rule create --name {name:my} --resource-group {rg} --rule-name office
        --start-ip-address 10.0.0.1 --end-ip-address 10.0.0.9
      - mysql flexible-server firewall-rule show --name {name:my} --resource-group {rg} --rule-name office
      - mysql flexible-server firewall-rule list --name {name:my} --resource-group {rg}
      - mysql flexible-server firewall-rule delete --name {name:my} --resource-group {rg} --rule-name office --yes
    command: mysql flexible-server db delete --server-name {name:my} --resource-group {rg} --database-name shop --yes
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: mysql-parameters
    operations:
      [
        Microsoft.DBforMySQL FlexibleServers Configurations_Get,
        Microsoft.DBforMySQL FlexibleServers Configurations_ListByServer,
        Microsoft.DBforMySQL FlexibleServers Configurations_Update,
        Microsoft.DBforMySQL FlexibleServers Configurations_CreateOrUpdate,
        Microsoft.DBforMySQL FlexibleServers Configurations_BatchUpdate,
      ]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - >-
        mysql flexible-server create --name {name:my} --resource-group {rg} --location {location}
        --tier Burstable --sku-name Standard_B1ms --admin-user myadmin --admin-password LocalStack123!
        --public-access None --yes
      - mysql flexible-server parameter show --server-name {name:my} --resource-group {rg} --name max_connections
      - mysql flexible-server parameter list --server-name {name:my} --resource-group {rg} --query "length(@) > `0`"
      - mysql flexible-server parameter set --server-name {name:my} --resource-group {rg} --name wait_timeout --value 300
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.DBforMySQL/flexibleServers/{name:my}/configurations/interactive_timeout?api-version=2023-12-30
        --body '{"properties": {"value": "600", "source": "user-override"}}'
    command: >-
      mysql flexible-server parameter set-batch --server-name {name:my} --resource-group {rg}
      --source user-override --args max_connections=120 wait_timeout=400
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: mysql-lifecycle
    operations:
      [
        Microsoft.DBforMySQL FlexibleServers Servers_Stop,
        Microsoft.DBforMySQL FlexibleServers Servers_Start,
        Microsoft.DBforMySQL FlexibleServers Servers_Restart,
        Microsoft.DBforMySQL FlexibleServers Servers_Delete,
      ]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - >-
        mysql flexible-server create --name {name:my} --resource-group {rg} --location {location}
        --tier Burstable --sku-name Standard_B1ms --admin-user myadmin --admin-password LocalStack123!
        --public-access None --yes
      - mysql flexible-server stop --name {name:my} --resource-group {rg}
      - mysql flexible-server start --name {name:my} --resource-group {rg}
      - mysql flexible-server restart --name {name:my} --resource-group {rg}
    command: mysql flexible-server delete --name {name:my} --resource-group {rg} --yes
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: mysql-backups-replicas-admins
    operations:
      [
        Microsoft.DBforMySQL FlexibleServers Backups_Put,
        Microsoft.DBforMySQL FlexibleServers Backups_Get,
        Microsoft.DBforMySQL FlexibleServers Backups_ListByServer,
        Microsoft.DBforMySQL FlexibleServers LongRunningBackup_Create,
        Microsoft.DBforMySQL FlexibleServers LongRunningBackups_List,
        Microsoft.DBforMySQL FlexibleServers Replicas_ListByServer,
        Microsoft.DBforMySQL FlexibleServers LogFiles_ListByServer,
        Microsoft.DBforMySQL FlexibleServers AzureAdAdministrators_ListByServer,
        Microsoft.DBforMySQL FlexibleServers AdvancedThreatProtectionSettings_Get,
        Microsoft.DBforMySQL FlexibleServers AdvancedThreatProtectionSettings_List,
        Microsoft.DBforMySQL FlexibleServers AdvancedThreatProtectionSettings_Update,
        Microsoft.DBforMySQL FlexibleServers PrivateLinkResources_ListByServer,
        Microsoft.DBforMySQL FlexibleServers Maintenances_List,
      ]
    backing: true
    note: >-
      The backup is read back by the name the PUT returned, not by manual1:
      the service names an on-demand backup customer-<time>-<guid>-manual1. az's
      `backup create` and `backup list` call the long-running backupsV2 API, so Backups_* go
      through rest.
    setup:
      - group create --name {rg} --location {location}
      - >-
        mysql flexible-server create --name {name:my} --resource-group {rg} --location {location}
        --tier Burstable --sku-name Standard_B1ms --admin-user myadmin --admin-password LocalStack123!
        --public-access None --yes
      - run: >-
          rest --method put
          --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.DBforMySQL/flexibleServers/{name:my}/backups/manual1?api-version=2023-12-30
          --query name -o tsv
        capture: backup
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.DBforMySQL/flexibleServers/{name:my}/backups/{backup}?api-version=2023-12-30
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.DBforMySQL/flexibleServers/{name:my}/backups?api-version=2023-12-30
      - mysql flexible-server backup create --name {name:my} --resource-group {rg} --backup-name manual2
      - mysql flexible-server backup list --name {name:my} --resource-group {rg}
      - mysql flexible-server replica list --name {name:my} --resource-group {rg}
      - mysql flexible-server server-logs list --server-name {name:my} --resource-group {rg}
      - mysql flexible-server ad-admin list --server-name {name:my} --resource-group {rg}
      - mysql flexible-server advanced-threat-protection-setting show --name {name:my} --resource-group {rg}
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.DBforMySQL/flexibleServers/{name:my}/advancedThreatProtectionSettings?api-version=2023-12-30
      # rest, not `advanced-threat-protection-setting update`: az 2.90 PATCHes {"state": "Enabled"}
      # without its properties envelope (2.85 sends it right), which the emulator rightly refuses
      # with 400 InvalidParameterValue.
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.DBforMySQL/flexibleServers/{name:my}/advancedThreatProtectionSettings/Default?api-version=2023-12-30
        --body '{"properties": {"state": "Enabled"}}'
      - network private-link-resource list --name {name:my} --resource-group {rg} --type Microsoft.DBforMySQL/flexibleServers
    command: >-
      rest --method get
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.DBforMySQL/flexibleServers/{name:my}/maintenances?api-version=2023-12-30
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: mysql-maintenance
    operations:
      [
        Microsoft.DBforMySQL FlexibleServers Maintenances_Read,
        Microsoft.DBforMySQL FlexibleServers Maintenances_Update,
      ]
    backing: true
    note: >-
      The case reads the listed maintenance record and reschedules it.
    setup:
      - group create --name {rg} --location {location}
      - >-
        mysql flexible-server create --name {name:my} --resource-group {rg} --location {location}
        --tier Burstable --sku-name Standard_B1ms --admin-user myadmin --admin-password LocalStack123!
        --public-access None --yes
      - run: >-
          rest --method get
          --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.DBforMySQL/flexibleServers/{name:my}/maintenances?api-version=2023-12-30
          --query "value[0].name" -o tsv
        capture: maintenance
        until: { stdout: { matches: "." } }
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.DBforMySQL/flexibleServers/{name:my}/maintenances/{maintenance}?api-version=2023-12-30
    command: >-
      rest --method patch
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.DBforMySQL/flexibleServers/{name:my}/maintenances/{maintenance}?api-version=2023-12-30
      --body '{"properties": {"maintenanceStartTime": "2030-01-06T01:00:00Z"}}'
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: mysql-reset-gtid
    operations: [Microsoft.DBforMySQL FlexibleServers Servers_ResetGtid]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - >-
        mysql flexible-server create --name {name:my} --resource-group {rg} --location {location}
        --tier Burstable --sku-name Standard_B1ms --admin-user myadmin --admin-password LocalStack123!
        --public-access None --yes
    command: mysql flexible-server gtid reset --resource-group {rg} --server-name {name:my} --gtid-set 1 --yes
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        ResetGtid needs GTID enabled, and the emulator's create handler
        exposes no property to enable it.
      date: 2026-09-27
