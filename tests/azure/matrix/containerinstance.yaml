# Microsoft.ContainerInstance: container groups. Every case runs a real container on the
# emulator's Docker engine, so all are `backing: true` (nginx:latest, the benchmark's image).
# `container exec` and `container attach` are refused by the policy (they open a shell or a
# stream), so Attach and ExecuteCommand go through rest, which only returns the connection info.
# R.1: the typed server skipped ExecuteCommand because its fixture sent the group name where the
# emulator wants the inner container's name; az names the container after the group, so the
# case below passes that name.
provider: Microsoft.ContainerInstance
cases:
  - id: aci-create
    operations:
      [
        Microsoft.ContainerInstance ContainerGroups CreateOrUpdate,
        Microsoft.ContainerInstance ContainerGroups Get,
      ]
    backing: true
    note: Samples container create/show (aci-blob-storage).
    setup:
      - group create --name {rg} --location {location}
      - >-
        container create --name {name:aci} --resource-group {rg} --location {location} --image nginx:latest
        --os-type Linux --cpu 1 --memory 1 --ports 80 --restart-policy Never
    command: container show --name {name:aci} --resource-group {rg}
    expect:
      json:
        - { path: provisioningState, equals: Succeeded }
        - { path: "containers[0].image", equals: "nginx:latest" }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: aci-list-logs
    operations:
      [
        Microsoft.ContainerInstance ContainerGroups ListByResourceGroup,
        Microsoft.ContainerInstance ContainerGroups List,
        Microsoft.ContainerInstance Containers ListLogs,
      ]
    backing: true
    note: The benchmark's oracle (ta.py aci-list); samples container list/logs.
    setup:
      - group create --name {rg} --location {location}
      - container create --name {name:aci} --resource-group {rg} --image nginx:latest --os-type Linux --ports 80
      - run: container list --resource-group {rg} --query "[].name"
        until: { json: { path: "", equals: ["{name:aci}"] } }
      - container list --query "[?name=='{name:aci}'].name"
    command: container logs --name {name:aci} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: aci-stop-start-restart
    operations:
      [
        Microsoft.ContainerInstance ContainerGroups Stop,
        Microsoft.ContainerInstance ContainerGroups Start,
        Microsoft.ContainerInstance ContainerGroups Restart,
      ]
    backing: true
    note: The benchmark's oracle (ta.py aci-stop); samples container stop/start/restart.
    setup:
      - group create --name {rg} --location {location}
      - container create --name {name:aci} --resource-group {rg} --image nginx:latest --os-type Linux --ports 80
      - container stop --name {name:aci} --resource-group {rg}
      - container start --name {name:aci} --resource-group {rg}
    command: container restart --name {name:aci} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: aci-update-attach
    operations:
      [
        Microsoft.ContainerInstance ContainerGroups Update,
        Microsoft.ContainerInstance Containers Attach,
      ]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - container create --name {name:aci} --resource-group {rg} --image nginx:latest --os-type Linux --ports 80
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ContainerInstance/containerGroups/{name:aci}?api-version=2023-05-01
        --body '{"tags": {"matrix": "l2"}}'
    command: >-
      rest --method post
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ContainerInstance/containerGroups/{name:aci}/containers/{name:aci}/attach?api-version=2023-05-01
    expect:
      json: { path: webSocketUri, exists: true }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: aci-execute-command
    operations: [Microsoft.ContainerInstance Containers ExecuteCommand]
    backing: true
    setup:
      - group create --name {rg} --location {location}
      - container create --name {name:aci} --resource-group {rg} --image nginx:latest --os-type Linux --ports 80
    command: >-
      rest --method post
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ContainerInstance/containerGroups/{name:aci}/containers/{name:aci}/exec?api-version=2023-05-01
      --body '{"command": "/bin/sh", "terminalSize": {"rows": 24, "cols": 80}}'
    expect:
      json: { path: webSocketUri, exists: true }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: aci-delete
    operations: [Microsoft.ContainerInstance ContainerGroups Delete]
    backing: true
    note: The benchmark's oracle (ta.py aci-delete); samples container delete.
    setup:
      - group create --name {rg} --location {location}
      - container create --name {name:aci} --resource-group {rg} --image nginx:latest --os-type Linux --ports 80
    command: container delete --name {name:aci} --resource-group {rg} --yes
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait
