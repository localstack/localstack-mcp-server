        Microsoft.Cdn EdgeActionExecutionFilters ListByEdgeAction,
        Microsoft.Cdn EdgeActionExecutionFilters Update,
        Microsoft.Cdn EdgeActionExecutionFilters Delete,
        Microsoft.Cdn EdgeActionVersions Delete,
        Microsoft.Cdn EdgeActions Delete,
      ]
    setup:
      - group create --name {rg} --location {location}
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}?api-version=2025-09-01-preview
        --body '{"location": "global", "sku": {"name": "Standard", "tier": "Standard"}, "properties": {}}'
      - run: >-
          rest --method get
          --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}?api-version=2025-09-01-preview
        until: { json: { path: name, equals: "{alnum:ea}" } }
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions?api-version=2025-09-01-preview
      - rest --method get --url /subscriptions/{sub}/providers/Microsoft.Cdn/edgeActions?api-version=2025-09-01-preview
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}?api-version=2025-09-01-preview
