  - id: cdn-edge-action-filter-patch-tags
    operations: [Microsoft.Cdn EdgeActionExecutionFilters Update]
    setup:
      - group create --name {rg} --location {location}
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}?api-version=2025-09-01-preview
        --body '{"location": "global", "sku": {"name": "Standard", "tier": "Standard"}, "properties": {}}'
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/versions/v1?api-version=2025-09-01-preview
        --body '{"location": "global", "properties": {"deploymentType": "file", "isDefaultVersion": "True"}}'
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/executionFilters/f1?api-version=2025-09-01-preview
        --body '{"location": "global", "properties": {"versionId": "v1", "executionFilterIdentifierHeaderName": "x-l2",
        "executionFilterIdentifierHeaderValue": "on"}}'
    command: >-
      rest --method patch
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/executionFilters/f1?api-version=2025-09-01-preview
      --body '{"tags": {"matrix": "l2"}}'
    expect:
      json: { path: tags.matrix, equals: l2 }
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        L2: the execution filter PATCH is validated as a full PUT: tags alone answer 400 "Property
