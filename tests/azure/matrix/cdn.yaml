      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/versions/v1?api-version=2025-09-01-preview
        --body '{"location": "global", "properties": {"deploymentType": "file", "isDefaultVersion": "True"}}'
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/versions/v1?api-version=2025-09-01-preview
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/versions?api-version=2025-09-01-preview
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/versions/v1?api-version=2025-09-01-preview
        --body '{"tags": {"matrix": "l2"}}'
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/versions/v1/deployVersionCode?api-version=2025-09-01-preview
        --body '{"content": "ZXhwb3J0IGRlZmF1bHQge30=", "name": "index.js"}'
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/versions/v1/getVersionCode?api-version=2025-09-01-preview
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/versions/v1/swapDefault?api-version=2025-09-01-preview
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/executionFilters/f1?api-version=2025-09-01-preview
        --body '{"location": "global", "properties": {"versionId": "v1", "executionFilterIdentifierHeaderName": "x-l2",
        "executionFilterIdentifierHeaderValue": "on"}}'
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/executionFilters/f1?api-version=2025-09-01-preview
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/executionFilters?api-version=2025-09-01-preview
      # The PATCH is validated as a full PUT (cdn-edge-action-filter-patch-tags), so this one
      # repeats every required property.
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/executionFilters/f1?api-version=2025-09-01-preview
        --body '{"tags": {"matrix": "l2"}, "properties": {"versionId": "v1", "executionFilterIdentifierHeaderName": "x-l2",
        "executionFilterIdentifierHeaderValue": "on"}}'
      - >-
        rest --method delete
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/executionFilters/f1?api-version=2025-09-01-preview
      - >-
        rest --method delete
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/versions/v1?api-version=2025-09-01-preview
    command: >-
      rest --method delete
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}?api-version=2025-09-01-preview
    expect:
      exitCode: 0
    cleanup:
