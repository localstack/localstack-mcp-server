        Microsoft.Cdn Endpoints Create,
        Microsoft.Cdn Endpoints Get,
        Microsoft.Cdn Endpoints ListByProfile,
        Microsoft.Cdn Endpoints Update,
        Microsoft.Cdn Endpoints Stop,
        Microsoft.Cdn Endpoints Start,
        Microsoft.Cdn Endpoints PurgeContent,
        Microsoft.Cdn Endpoints LoadContent,
        Microsoft.Cdn Endpoints ValidateCustomDomain,
        Microsoft.Cdn Endpoints ListResourceUsage,
        Microsoft.Cdn Profiles ListSupportedOptimizationTypes,
        Microsoft.Cdn Endpoints Delete,
      ]
    setup:
      - group create --name {rg} --location {location}
      - cdn profile create --name {name:cdn} --resource-group {rg} --sku Standard_Microsoft
      - cdn endpoint create --name {name:ep} --profile-name {name:cdn} --resource-group {rg} --origin www.example.com
      - run: cdn endpoint show --name {name:ep} --profile-name {name:cdn} --resource-group {rg} --query hostName -o tsv
        until: { stdout: { contains: "{name:ep}" } }
      - cdn endpoint list --profile-name {name:cdn} --resource-group {rg}
      - cdn endpoint update --name {name:ep} --profile-name {name:cdn} --resource-group {rg} --no-http false
      - cdn endpoint stop --name {name:ep} --profile-name {name:cdn} --resource-group {rg}
      - cdn endpoint start --name {name:ep} --profile-name {name:cdn} --resource-group {rg}
      - cdn endpoint purge --name {name:ep} --profile-name {name:cdn} --resource-group {rg} --content-paths "/*"
      - cdn endpoint load --name {name:ep} --profile-name {name:cdn} --resource-group {rg} --content-paths /index.html
      - cdn endpoint validate-custom-domain --name {name:ep} --profile-name {name:cdn} --resource-group {rg} --host-name www.{id}.example.com
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{name:cdn}/endpoints/{name:ep}/checkResourceUsage?api-version=2024-02-01
      # No `cdn profile list-supported-optimization-types` in the curated cdn extension (1.0.0b3).
      - run: >-
          rest --method post
          --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{name:cdn}/getSupportedOptimizationTypes?api-version=2024-02-01
        until: { json: { path: supportedOptimizationTypes, contains: GeneralWebDelivery } }
    command: cdn endpoint delete --name {name:ep} --profile-name {name:cdn} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: cdn-classic-origins-domains
    operations:
      [
        Microsoft.Cdn Origins Get,
        Microsoft.Cdn Origins ListByEndpoint,
        Microsoft.Cdn Origins Update,
        Microsoft.Cdn Origins Create,
        Microsoft.Cdn Origins Delete,
        Microsoft.Cdn OriginGroups Create,
        Microsoft.Cdn OriginGroups Get,
        Microsoft.Cdn OriginGroups ListByEndpoint,
        Microsoft.Cdn OriginGroups Update,
        Microsoft.Cdn OriginGroups Delete,
        Microsoft.Cdn CustomDomains Create,
        Microsoft.Cdn CustomDomains Get,
        Microsoft.Cdn CustomDomains ListByEndpoint,
        Microsoft.Cdn CustomDomains EnableCustomHttps,
        Microsoft.Cdn CustomDomains DisableCustomHttps,
        Microsoft.Cdn CustomDomains Delete,
      ]
    setup:
      - group create --name {rg} --location {location}
      - cdn profile create --name {name:cdn} --resource-group {rg} --sku Standard_Microsoft
      - cdn endpoint create --name {name:ep} --profile-name {name:cdn} --resource-group {rg} --origin www.example.com
      - run: cdn origin list --endpoint-name {name:ep} --profile-name {name:cdn} --resource-group {rg} --query "[0].name" -o tsv
        capture: origin
      - cdn origin show --endpoint-name {name:ep} --profile-name {name:cdn} --resource-group {rg} --name {origin}
      - cdn origin update --endpoint-name {name:ep} --profile-name {name:cdn} --resource-group {rg} --name {origin} --http-port 8080
      - run: >-
          cdn origin create --endpoint-name {name:ep} --profile-name {name:cdn} --resource-group {rg} --name backup
          --host-name backup.example.com --query id -o tsv
        capture: backup_id
      # Shorthand --formatted-origins and --health-probe-settings (cdn extension 1.0.0b3; the
      # older --origins and --probe-interval are gone).
      - >-
        cdn origin-group create --endpoint-name {name:ep} --profile-name {name:cdn} --resource-group {rg} --name og
        --formatted-origins "[{id:{backup_id}}]"
        --health-probe-settings "{probe-interval-in-seconds:120,probe-path:/,probe-protocol:Http,probe-request-type:GET}"
      - cdn origin-group show --endpoint-name {name:ep} --profile-name {name:cdn} --resource-group {rg} --name og
      - cdn origin-group list --endpoint-name {name:ep} --profile-name {name:cdn} --resource-group {rg}
      - run: >-
          cdn origin-group update --endpoint-name {name:ep} --profile-name {name:cdn} --resource-group {rg} --name og
          --health-probe-settings "{probe-interval-in-seconds:60,probe-path:/health,probe-protocol:Http,probe-request-type:HEAD}"
          --query healthProbeSettings.probeIntervalInSeconds
        until: { json: { path: "", equals: 60 } }
      - cdn origin-group delete --endpoint-name {name:ep} --profile-name {name:cdn} --resource-group {rg} --name og --yes
      - cdn origin delete --endpoint-name {name:ep} --profile-name {name:cdn} --resource-group {rg} --name backup --yes
      - >-
        cdn custom-domain create --endpoint-name {name:ep} --profile-name {name:cdn} --resource-group {rg}
        --name www --hostname www.{id}.example.com
      - cdn custom-domain show --endpoint-name {name:ep} --profile-name {name:cdn} --resource-group {rg} --name www
      - cdn custom-domain list --endpoint-name {name:ep} --profile-name {name:cdn} --resource-group {rg}
      - cdn custom-domain enable-https --endpoint-name {name:ep} --profile-name {name:cdn} --resource-group {rg} --name www
      - cdn custom-domain disable-https --endpoint-name {name:ep} --profile-name {name:cdn} --resource-group {rg} --name www
    command: cdn custom-domain delete --endpoint-name {name:ep} --profile-name {name:cdn} --resource-group {rg} --name www
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: cdn-waf-policy
    operations:
      [
        Microsoft.Cdn Policies CreateOrUpdate,
        Microsoft.Cdn Policies Get,
        Microsoft.Cdn Policies List,
        Microsoft.Cdn Policies Update,
        Microsoft.Cdn Policies Delete,
      ]
    note: >-
      Through rest: az 2.85 with the curated cdn extension (1.0.0b3) has no `cdn waf policy` group
      (L2 flag lint, 2026-09-27).
    setup:
      - group create --name {rg} --location {location}
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/CdnWebApplicationFirewallPolicies/{alnum:waf}?api-version=2024-02-01
        --body '{"location": "Global", "sku": {"name": "Standard_Microsoft"}, "properties": {"policySettings": {"enabledState": "Enabled", "mode": "Detection"}}}'
      - run: >-
          rest --method get
          --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/CdnWebApplicationFirewallPolicies/{alnum:waf}?api-version=2024-02-01
        until: { json: { path: properties.policySettings.mode, equals: Detection } }
      - run: >-
          rest --method get
          --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/CdnWebApplicationFirewallPolicies?api-version=2024-02-01
          --query "value[].name"
        until: { json: { path: "", equals: ["{alnum:waf}"] } }
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/CdnWebApplicationFirewallPolicies/{alnum:waf}?api-version=2024-02-01
        --body '{"tags": {"matrix": "l2"}}'
    command: >-
      rest --method delete
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/CdnWebApplicationFirewallPolicies/{alnum:waf}?api-version=2024-02-01
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: cdn-migration
    operations: [Microsoft.Cdn Profiles CdnCanMigrateToAfd, Microsoft.Cdn Profiles CdnMigrateToAfd]
    setup:
      - group create --name {rg} --location {location}
      - cdn profile create --name {name:cdn} --resource-group {rg} --sku Standard_Microsoft
      # The emulator refuses to migrate a profile without endpoints ("has no endpoints to migrate").
      - cdn endpoint create --name {name:ep} --profile-name {name:cdn} --resource-group {rg} --origin www.example.com
      - cdn profile-migration check-compatibility --profile-name {name:cdn} --resource-group {rg}
    command: cdn profile-migration migrate --profile-name {name:cdn} --resource-group {rg} --sku Standard_AzureFrontDoor
    expect:
      json: { path: migratedProfileResourceId.id, contains: "{name:cdn}" }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: cdn-migration-abort
    operations: [Microsoft.Cdn Profiles MigrationAbort]
    setup:
      - group create --name {rg} --location {location}
      - cdn profile create --name {name:cdn} --resource-group {rg} --sku Standard_Microsoft
      - cdn endpoint create --name {name:ep} --profile-name {name:cdn} --resource-group {rg} --origin www.example.com
      - cdn profile-migration migrate --profile-name {name:cdn} --resource-group {rg} --sku Standard_AzureFrontDoor
    command: cdn profile-migration abort --profile-name {name:cdn} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        L2: POST .../migrationAbort answers 202 with a Location header, and polling that Location
        answers 200 with `{"status": "Succeeded"}`. A 200 from a Location URL is the operation's
        final result, and abort has none (ARM: 204), so the CLI's poller (cdn extension 1.0.0b3)
        crashes with TypeError "'NoneType' object is not callable" (seen in --debug).
      date: 2026-09-27

  - id: cdn-migration-commit
    operations: [Microsoft.Cdn Profiles MigrationCommit]
    setup:
      - group create --name {rg} --location {location}
      - cdn profile create --name {name:cdn} --resource-group {rg} --sku Standard_Microsoft
      # The emulator refuses to migrate a profile without endpoints ("has no endpoints to migrate").
      - cdn endpoint create --name {name:ep} --profile-name {name:cdn} --resource-group {rg} --origin www.example.com
      - cdn profile-migration migrate --profile-name {name:cdn} --resource-group {rg} --sku Standard_AzureFrontDoor
    command: cdn profile-migration commit --profile-name {name:cdn} --resource-group {rg}
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: afd-classic-migration
    operations: [Microsoft.Cdn Profiles CanMigrate, Microsoft.Cdn Profiles Migrate]
    note: Classic Front Door (Microsoft.Network) to Front Door Standard; CI sets FRONT_DOOR_CLASSIC_ALLOW_CREATE=1.
    setup:
      - group create --name {rg} --location {location}
      - run: network front-door create --name {name:fd} --resource-group {rg} --backend-address www.example.com --query id -o tsv
        capture: fd_id
      - >-
        rest --method post --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/canMigrate?api-version=2024-02-01
        --body '{"classicResourceReference": {"id": "{fd_id}"}}'
    command: >-
      rest --method post --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/migrate?api-version=2024-02-01
      --body '{"sku": {"name": "Standard_AzureFrontDoor"}, "classicResourceReference": {"id": "{fd_id}"}, "profileName": "{name:afd}"}'
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

