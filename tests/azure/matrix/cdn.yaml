# Microsoft.Cdn: Front Door Standard/Premium (afd), classic CDN (cdn; CI starts the emulator with
# CDN_CLASSIC_ALLOW_CREATE=1), WAF policies, log analytics, migration, edge actions. `afd` and
# `cdn` are core (deprecated) in az 2.85-2.87 and extension-only from 2.90; the curated `cdn`
# extension (1.0.0b3) replaces the core commands wherever it is installed, so the cases use its
# syntax (shorthand --conditions/--actions, --parameters, --web-application-firewall,
# --formatted-origins). Edge actions go through rest (the `edge-action` extension is a preview).
provider: Microsoft.Cdn
cases:
  - id: afd-profile
    operations:
      [
        Microsoft.Cdn Profiles Create,
        Microsoft.Cdn Profiles Get,
        Microsoft.Cdn Profiles ListByResourceGroup,
        Microsoft.Cdn Profiles List,
        Microsoft.Cdn Profiles Update,
        Microsoft.Cdn Profiles ListResourceUsage,
      ]
    note: Samples afd profile create/show.
    setup:
      - group create --name {rg} --location {location}
      - afd profile create --profile-name {name:afd} --resource-group {rg} --sku Standard_AzureFrontDoor
      - run: afd profile show --profile-name {name:afd} --resource-group {rg} --query sku.name -o tsv
        until: { stdout: { equals: Standard_AzureFrontDoor } }
      - afd profile list --resource-group {rg}
      - afd profile list --query "[?name=='{name:afd}'].name"
      - afd profile usage --profile-name {name:afd} --resource-group {rg}
    command: afd profile update --profile-name {name:afd} --resource-group {rg} --tags matrix=l2
    expect:
      json: { path: tags.matrix, equals: l2 }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: afd-endpoint
    operations:
      [
        Microsoft.Cdn AfdEndpoints Create,
        Microsoft.Cdn AfdEndpoints Get,
        Microsoft.Cdn AfdEndpoints ListByProfile,
        Microsoft.Cdn AfdEndpoints Update,
        Microsoft.Cdn AfdEndpoints PurgeContent,
        Microsoft.Cdn AfdEndpoints ValidateCustomDomain,
        Microsoft.Cdn AfdEndpoints ListResourceUsage,
        Microsoft.Cdn AfdEndpoints Delete,
      ]
    note: Samples afd endpoint create/show/purge/update.
    setup:
      - group create --name {rg} --location {location}
      - afd profile create --profile-name {name:afd} --resource-group {rg} --sku Standard_AzureFrontDoor
      - afd endpoint create --endpoint-name {name:ep} --profile-name {name:afd} --resource-group {rg} --enabled-state Enabled
      - run: afd endpoint show --endpoint-name {name:ep} --profile-name {name:afd} --resource-group {rg} --query enabledState -o tsv
        until: { stdout: { equals: Enabled } }
      - afd endpoint list --profile-name {name:afd} --resource-group {rg}
      - afd endpoint update --endpoint-name {name:ep} --profile-name {name:afd} --resource-group {rg} --enabled-state Disabled
      - afd endpoint purge --endpoint-name {name:ep} --profile-name {name:afd} --resource-group {rg} --content-paths "/*"
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{name:afd}/afdEndpoints/{name:ep}/validateCustomDomain?api-version=2024-02-01
        --body '{"hostName": "www.{id}.example.com"}'
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{name:afd}/afdEndpoints/{name:ep}/usages?api-version=2024-02-01
    command: afd endpoint delete --endpoint-name {name:ep} --profile-name {name:afd} --resource-group {rg} --yes
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: afd-origins
    operations:
      [
        Microsoft.Cdn AfdOriginGroups Create,
        Microsoft.Cdn AfdOriginGroups Get,
        Microsoft.Cdn AfdOriginGroups ListByProfile,
        Microsoft.Cdn AfdOriginGroups Update,
        Microsoft.Cdn AfdOriginGroups ListResourceUsage,
        Microsoft.Cdn AfdOrigins Create,
        Microsoft.Cdn AfdOrigins Get,
        Microsoft.Cdn AfdOrigins ListByOriginGroup,
        Microsoft.Cdn AfdOrigins Update,
        Microsoft.Cdn AfdOrigins Delete,
        Microsoft.Cdn AfdOriginGroups Delete,
      ]
    note: Samples afd origin-group/origin create.
    setup:
      - group create --name {rg} --location {location}
      - afd profile create --profile-name {name:afd} --resource-group {rg} --sku Standard_AzureFrontDoor
      - >-
        afd origin-group create --origin-group-name og --profile-name {name:afd} --resource-group {rg}
        --probe-request-type GET --probe-protocol Http --probe-interval-in-seconds 60 --probe-path /
        --sample-size 4 --successful-samples-required 3 --additional-latency-in-milliseconds 50
      - afd origin-group show --origin-group-name og --profile-name {name:afd} --resource-group {rg}
      - afd origin-group list --profile-name {name:afd} --resource-group {rg}
      - afd origin-group update --origin-group-name og --profile-name {name:afd} --resource-group {rg} --probe-path /health
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{name:afd}/originGroups/og/usages?api-version=2024-02-01
      - >-
        afd origin create --origin-name web1 --origin-group-name og --profile-name {name:afd} --resource-group {rg}
        --host-name www.example.com --origin-host-header www.example.com --http-port 80 --https-port 443
        --priority 1 --weight 1000 --enabled-state Enabled
      - run: afd origin show --origin-name web1 --origin-group-name og --profile-name {name:afd} --resource-group {rg} --query hostName -o tsv
        until: { stdout: { equals: www.example.com } }
      - afd origin list --origin-group-name og --profile-name {name:afd} --resource-group {rg}
      - afd origin update --origin-name web1 --origin-group-name og --profile-name {name:afd} --resource-group {rg} --weight 500
      - afd origin delete --origin-name web1 --origin-group-name og --profile-name {name:afd} --resource-group {rg} --yes
    command: afd origin-group delete --origin-group-name og --profile-name {name:afd} --resource-group {rg} --yes
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: afd-route
    operations: [Microsoft.Cdn Routes Create, Microsoft.Cdn Routes ListByEndpoint]
    note: Samples afd route create.
    setup:
      - group create --name {rg} --location {location}
      - afd profile create --profile-name {name:afd} --resource-group {rg} --sku Standard_AzureFrontDoor
      - afd endpoint create --endpoint-name {name:ep} --profile-name {name:afd} --resource-group {rg} --enabled-state Enabled
      - >-
        afd origin-group create --origin-group-name og --profile-name {name:afd} --resource-group {rg}
        --probe-request-type GET --probe-protocol Http --probe-interval-in-seconds 60 --probe-path /
        --sample-size 4 --successful-samples-required 3 --additional-latency-in-milliseconds 50
      - >-
        afd origin create --origin-name web1 --origin-group-name og --profile-name {name:afd} --resource-group {rg}
        --host-name www.example.com --origin-host-header www.example.com --priority 1 --weight 1000 --enabled-state Enabled
      - >-
        afd route create --route-name r1 --endpoint-name {name:ep} --profile-name {name:afd} --resource-group {rg}
        --origin-group og --supported-protocols Http Https --link-to-default-domain Enabled
        --forwarding-protocol MatchRequest --https-redirect Enabled
    command: afd route list --endpoint-name {name:ep} --profile-name {name:afd} --resource-group {rg} --query "[].name"
    expect:
      json: { path: "", equals: [r1] }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: afd-route-read
    operations: [Microsoft.Cdn Routes Get, Microsoft.Cdn Routes Update, Microsoft.Cdn Routes Delete]
    setup:
      - group create --name {rg} --location {location}
      - afd profile create --profile-name {name:afd} --resource-group {rg} --sku Standard_AzureFrontDoor
      - afd endpoint create --endpoint-name {name:ep} --profile-name {name:afd} --resource-group {rg} --enabled-state Enabled
      - >-
        afd origin-group create --origin-group-name og --profile-name {name:afd} --resource-group {rg}
        --probe-request-type GET --probe-protocol Http --probe-interval-in-seconds 60 --probe-path /
        --sample-size 4 --successful-samples-required 3 --additional-latency-in-milliseconds 50
      - >-
        afd origin create --origin-name web1 --origin-group-name og --profile-name {name:afd} --resource-group {rg}
        --host-name www.example.com --origin-host-header www.example.com --priority 1 --weight 1000 --enabled-state Enabled
      - >-
        afd route create --route-name r1 --endpoint-name {name:ep} --profile-name {name:afd} --resource-group {rg}
        --origin-group og --supported-protocols Http Https --link-to-default-domain Enabled
        --forwarding-protocol MatchRequest --https-redirect Enabled
      - run: afd route show --route-name r1 --endpoint-name {name:ep} --profile-name {name:afd} --resource-group {rg} --query name -o tsv
        until: { stdout: { equals: r1 } }
      - run: >-
          afd route update --route-name r1 --endpoint-name {name:ep} --profile-name {name:afd} --resource-group {rg}
          --https-redirect Disabled --query httpsRedirect -o tsv
        until: { stdout: { equals: Disabled } }
    command: afd route delete --route-name r1 --endpoint-name {name:ep} --profile-name {name:afd} --resource-group {rg} --yes
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: afd-rule-sets
    operations:
      [
        Microsoft.Cdn RuleSets Create,
        Microsoft.Cdn RuleSets Get,
        Microsoft.Cdn RuleSets ListByProfile,
        Microsoft.Cdn RuleSets ListResourceUsage,
        Microsoft.Cdn Rules Create,
        Microsoft.Cdn Rules Get,
        Microsoft.Cdn Rules ListByRuleSet,
        Microsoft.Cdn Rules Update,
        Microsoft.Cdn Rules Delete,
        Microsoft.Cdn RuleSets Delete,
      ]
    note: Samples afd rule-set create/show, afd rule create (7 uses).
    setup:
      - group create --name {rg} --location {location}
      - afd profile create --profile-name {name:afd} --resource-group {rg} --sku Standard_AzureFrontDoor
      - afd rule-set create --rule-set-name headers --profile-name {name:afd} --resource-group {rg}
      - afd rule-set show --rule-set-name headers --profile-name {name:afd} --resource-group {rg}
      - afd rule-set list --profile-name {name:afd} --resource-group {rg}
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{name:afd}/ruleSets/headers/usages?api-version=2024-02-01
      # The curated cdn extension (1.0.0b3) takes conditions and actions in shorthand syntax; the
      # older --match-variable/--action-name flags are gone (L2 flag lint, 2026-09-27).
      - >-
        afd rule create --rule-name addheader --rule-set-name headers --profile-name {name:afd} --resource-group {rg}
        --order 1 --conditions "[{request-method:{parameters:{operator:Equal,match-values:[GET]}}}]"
        --actions "[{modify-response-header:{parameters:{header-action:Append,header-name:X-L2,value:matrix}}}]"
      - run: afd rule show --rule-name addheader --rule-set-name headers --profile-name {name:afd} --resource-group {rg} --query order
        until: { json: { path: "", equals: 1 } }
      - afd rule list --rule-set-name headers --profile-name {name:afd} --resource-group {rg}
      - afd rule update --rule-name addheader --rule-set-name headers --profile-name {name:afd} --resource-group {rg} --order 2
      - afd rule delete --rule-name addheader --rule-set-name headers --profile-name {name:afd} --resource-group {rg} --yes
    command: afd rule-set delete --rule-set-name headers --profile-name {name:afd} --resource-group {rg} --yes
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: afd-custom-domain
    operations:
      [
        Microsoft.Cdn AfdCustomDomains Create,
        Microsoft.Cdn AfdCustomDomains Get,
        Microsoft.Cdn AfdCustomDomains ListByProfile,
        Microsoft.Cdn AfdCustomDomains Update,
        Microsoft.Cdn AfdCustomDomains RefreshValidationToken,
        Microsoft.Cdn AfdCustomDomains Delete,
      ]
    setup:
      - group create --name {rg} --location {location}
      - afd profile create --profile-name {name:afd} --resource-group {rg} --sku Standard_AzureFrontDoor
      - >-
        afd custom-domain create --custom-domain-name www --profile-name {name:afd} --resource-group {rg}
        --host-name www.{id}.example.com --minimum-tls-version TLS12 --certificate-type ManagedCertificate
      - run: afd custom-domain show --custom-domain-name www --profile-name {name:afd} --resource-group {rg} --query hostName -o tsv
        until: { stdout: { equals: "www.{id}.example.com" } }
      - afd custom-domain list --profile-name {name:afd} --resource-group {rg}
      - afd custom-domain update --custom-domain-name www --profile-name {name:afd} --resource-group {rg} --minimum-tls-version TLS12
      - afd custom-domain regenerate-validation-token --custom-domain-name www --profile-name {name:afd} --resource-group {rg}
    command: afd custom-domain delete --custom-domain-name www --profile-name {name:afd} --resource-group {rg} --yes
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: afd-secret-security-policy
    operations:
      [
        Microsoft.Cdn Secrets Create,
        Microsoft.Cdn Secrets Get,
        Microsoft.Cdn Secrets ListByProfile,
        Microsoft.Cdn Secrets Update,
        Microsoft.Cdn Secrets Delete,
        Microsoft.Cdn SecurityPolicies Create,
        Microsoft.Cdn SecurityPolicies Get,
        Microsoft.Cdn SecurityPolicies ListByProfile,
        Microsoft.Cdn SecurityPolicies Patch,
        Microsoft.Cdn SecurityPolicies Delete,
        Microsoft.Cdn AfdProfiles ValidateSecret,
        Microsoft.Cdn Validate Secret,
      ]
    setup:
      - group create --name {rg} --location {location}
      - afd profile create --profile-name {name:afd} --resource-group {rg} --sku Premium_AzureFrontDoor
      - run: afd endpoint create --endpoint-name {name:ep} --profile-name {name:afd} --resource-group {rg} --enabled-state Enabled --query id -o tsv
        capture: endpoint_id
      - keyvault create --name {vault} --resource-group {rg} --location {location}
      - run: keyvault certificate get-default-policy -o json
        capture: policy
      - run: keyvault certificate create --vault-name {vault} --name tls --policy '{policy}' --query id -o tsv
        capture: cert_id
      - run: keyvault show --name {vault} --query id -o tsv
        capture: vault_id
      # Shorthand --parameters (cdn extension 1.0.0b3); the updates go through rest so that the
      # PATCH operations (Secrets Update, SecurityPolicies Patch) are the ones exercised.
      - >-
        afd secret create --profile-name {name:afd} --resource-group {rg} --secret-name tls
        --parameters "{customer-certificate:{secret-source:{id:{vault_id}/secrets/tls},use-latest-version:true}}"
      - afd secret show --profile-name {name:afd} --resource-group {rg} --secret-name tls
      - afd secret list --profile-name {name:afd} --resource-group {rg}
      # The PATCH answers 200 but keeps the old parameters (afd-secret-patch).
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{name:afd}/secrets/tls?api-version=2024-02-01
        --body '{"properties": {"parameters": {"type": "CustomerCertificate", "secretSource": {"id": "{vault_id}/secrets/tls"}, "useLatestVersion": false}}}'
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{name:afd}/validateSecret?api-version=2024-02-01
        --body '{"secretType": "CustomerCertificate", "secretSource": {"id": "{vault_id}/secrets/tls"}}'
      - >-
        rest --method post --url /subscriptions/{sub}/providers/Microsoft.Cdn/validateSecret?api-version=2024-02-01
        --body '{"secretType": "CustomerCertificate", "secretSource": {"id": "{vault_id}/secrets/tls"}}'
      - run: >-
          network front-door waf-policy create --name {alnum:waf} --resource-group {rg}
          --sku Premium_AzureFrontDoor --mode Detection --query id -o tsv
        capture: waf_id
      - >-
        afd security-policy create --security-policy-name waf --profile-name {name:afd} --resource-group {rg}
        --web-application-firewall "{waf-policy:{id:{waf_id}},associations:[{domains:[{id:{endpoint_id}}],patterns-to-match:['/*']}]}"
      - afd security-policy show --security-policy-name waf --profile-name {name:afd} --resource-group {rg}
      - afd security-policy list --profile-name {name:afd} --resource-group {rg}
      - >-
        rest --method patch
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{name:afd}/securityPolicies/waf?api-version=2024-02-01
        --body '{"properties": {"parameters": {"type": "WebApplicationFirewall", "wafPolicy": {"id": "{waf_id}"}, "associations": [{"domains": [{"id": "{endpoint_id}"}], "patternsToMatch": ["/*", "/l2/*"]}]}}}'
      - afd security-policy delete --security-policy-name waf --profile-name {name:afd} --resource-group {rg} --yes
    command: afd secret delete --profile-name {name:afd} --resource-group {rg} --secret-name tls --yes
    expect:
      exitCode: 0
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait

  - id: afd-secret-patch
    operations: [Microsoft.Cdn Secrets Update]
    note: "`afd secret update` does a GET and a PUT, which applies; the PATCH is what does not."
    setup:
      - group create --name {rg} --location {location}
      - afd profile create --profile-name {name:afd} --resource-group {rg} --sku Premium_AzureFrontDoor
      - run: keyvault create --name {vault} --resource-group {rg} --location {location} --query id -o tsv
        capture: vault_id
      - >-
        afd secret create --profile-name {name:afd} --resource-group {rg} --secret-name tls
        --parameters "{customer-certificate:{secret-source:{id:{vault_id}/secrets/tls},use-latest-version:true}}"
    command: >-
      rest --method patch
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{name:afd}/secrets/tls?api-version=2024-02-01
      --body '{"properties": {"parameters": {"type": "CustomerCertificate", "secretSource": {"id": "{vault_id}/secrets/tls"}, "useLatestVersion": false}}}'
      --query properties.parameters.useLatestVersion
    expect:
      json: { path: "", equals: false }
    cleanup:
      - keyvault delete --name {vault}
      - keyvault purge --name {vault}
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        L2: Secrets_Update (PATCH) answers 200 with the old parameters and never applies the new
        ones (useLatestVersion stayed true for 3 minutes of polling).
      date: 2026-09-27

  - id: afd-log-analytics
    operations:
      [
        Microsoft.Cdn LogAnalytics GetLogAnalyticsMetrics,
        Microsoft.Cdn LogAnalytics GetLogAnalyticsRankings,
        Microsoft.Cdn LogAnalytics GetLogAnalyticsResources,
        Microsoft.Cdn LogAnalytics GetLogAnalyticsLocations,
        Microsoft.Cdn LogAnalytics GetWafLogAnalyticsMetrics,
        Microsoft.Cdn LogAnalytics GetWafLogAnalyticsRankings,
      ]
    setup:
      - group create --name {rg} --location {location}
      - afd profile create --profile-name {name:afd} --resource-group {rg} --sku Premium_AzureFrontDoor
      - >-
        afd log-analytic metric list --profile-name {name:afd} --resource-group {rg} --metrics clientRequestCount
        --custom-domains www.{id}.example.com --protocols https
        --date-time-begin 2026-01-01T00:00:00Z --date-time-end 2026-01-08T00:00:00Z --granularity P1D
      - >-
        afd log-analytic ranking list --profile-name {name:afd} --resource-group {rg} --rankings url
        --metrics clientRequestCount --max-ranking 5 --date-time-begin 2026-01-01T00:00:00Z --date-time-end 2026-01-08T00:00:00Z
      - afd log-analytic resource list --profile-name {name:afd} --resource-group {rg}
      - afd log-analytic location list --profile-name {name:afd} --resource-group {rg}
      - >-
        afd waf-log-analytic metric list --profile-name {name:afd} --resource-group {rg} --metrics clientRequestCount
        --date-time-begin 2026-01-01T00:00:00Z --date-time-end 2026-01-08T00:00:00Z --granularity P1D
    command: >-
      afd waf-log-analytic ranking list --profile-name {name:afd} --resource-group {rg} --rankings action
      --metrics clientRequestCount --max-ranking 5 --date-time-begin 2026-01-01T00:00:00Z --date-time-end 2026-01-08T00:00:00Z
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: cdn-catalogue
    operations:
      [
        Microsoft.Cdn Microsoft.Cdn CheckNameAvailability,
        Microsoft.Cdn Microsoft.Cdn CheckNameAvailabilityWithSubscription,
        Microsoft.Cdn Microsoft.Cdn CheckEndpointNameAvailability,
        Microsoft.Cdn Microsoft.Cdn ValidateProbe,
        Microsoft.Cdn Operations List,
        Microsoft.Cdn ResourceUsage List,
        Microsoft.Cdn EdgeNodes List,
        Microsoft.Cdn ManagedRuleSets List,
      ]
    setup:
      - group create --name {rg} --location {location}
      - cdn name-exists --name {name:cdn}
      - >-
        rest --method post --url /subscriptions/{sub}/providers/Microsoft.Cdn/checkNameAvailability?api-version=2024-02-01
        --body '{"name": "{name:cdn}", "type": "Microsoft.Cdn/Profiles/Endpoints"}'
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/checkEndpointNameAvailability?api-version=2024-02-01
        --body '{"name": "{name:cdn}", "type": "Microsoft.Cdn/Profiles/AfdEndpoints", "autoGeneratedDomainNameLabelScope": "TenantReuse"}'
      - >-
        rest --method post --url /subscriptions/{sub}/providers/Microsoft.Cdn/validateProbe?api-version=2024-02-01
        --body '{"probeURL": "https://www.example.com/health"}'
      - rest --method get --url /providers/Microsoft.Cdn/operations?api-version=2024-02-01
      - rest --method post --url /subscriptions/{sub}/providers/Microsoft.Cdn/checkResourceUsage?api-version=2024-02-01
      - rest --method get --url /providers/Microsoft.Cdn/edgenodes?api-version=2024-02-01
    command: rest --method get --url /subscriptions/{sub}/providers/Microsoft.Cdn/CdnWebApplicationFirewallManagedRuleSets?api-version=2024-02-01
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: afd-host-name-check
    operations:
      [
        Microsoft.Cdn AfdProfiles CheckHostNameAvailability,
        Microsoft.Cdn AfdProfiles ListResourceUsage,
      ]
    setup:
      - group create --name {rg} --location {location}
      - afd profile create --profile-name {name:afd} --resource-group {rg} --sku Standard_AzureFrontDoor
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{name:afd}/usages?api-version=2024-02-01
    command: >-
      rest --method post
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{name:afd}/checkHostNameAvailability?api-version=2024-02-01
      --body '{"hostName": "www.{id}.example.com"}'
    expect:
      json: { path: nameAvailable, equals: true }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: afd-endpoint-name-check
    operations: [Microsoft.Cdn AfdProfiles CheckEndpointNameAvailability]
    setup:
      - group create --name {rg} --location {location}
      - afd profile create --profile-name {name:afd} --resource-group {rg} --sku Standard_AzureFrontDoor
    command: >-
      rest --method post
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{name:afd}/checkEndpointNameAvailability?api-version=2024-02-01
      --body '{"name": "ep{id}", "type": "Microsoft.Cdn/Profiles/AfdEndpoints", "autoGeneratedDomainNameLabelScope": "TenantReuse"}'
    expect:
      json: { path: nameAvailable, equals: true }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: afd-profile-upgrade-delete
    operations: [Microsoft.Cdn AfdProfiles Upgrade, Microsoft.Cdn Profiles Delete]
    setup:
      - group create --name {rg} --location {location}
      - afd profile create --profile-name {name:afd} --resource-group {rg} --sku Standard_AzureFrontDoor
      - >-
        rest --method post
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{name:afd}/upgrade?api-version=2024-02-01
