  - id: cdn-edge-action-attachment
    operations:
      [Microsoft.Cdn EdgeActions AddAttachment, Microsoft.Cdn EdgeActions DeleteAttachment]
    setup:
      - group create --name {rg} --location {location}
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}?api-version=2025-09-01-preview
        --body '{"location": "global", "sku": {"name": "Standard", "tier": "Standard"}, "properties": {}}'
    command: >-
      rest --method post
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/edgeActions/{alnum:ea}/addAttachment?api-version=2025-09-01-preview
      --body '{"attachedResourceId": "/subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/p/ruleSets/rs/rules/r"}'
    expect:
      exitCode: 0
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        The handler dereferences its request model unguarded
        (`A=parameters; D.require_edge_action(A.subscription_id, ...)`) and the parser passes None, so
        AddAttachment and DeleteAttachment answer HTTP 500 AttributeError for every body and
        api-version (verified 2026-09-22 with four bodies and four api-versions).
      date: 2026-09-27
