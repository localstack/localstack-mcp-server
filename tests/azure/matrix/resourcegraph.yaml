# Microsoft.ResourceGraph: KQL queries over the emulator's resources. `graph query` comes from
# the curated resource-graph extension; the same query also goes through rest, without it.
# KQL's `|` is fine inside quotes (the tokenizer only refuses shell syntax outside quotes).
provider: Microsoft.ResourceGraph
cases:
  - id: resource-graph-query
    operations: [Microsoft.ResourceGraph Microsoft.ResourceGraph Resources]
    pr: true
    setup:
      - group create --name {rg} --location {location}
      - identity create --name {name:id} --resource-group {rg} --location {location}
    command: >-
      graph query -q "Resources | where resourceGroup =~ '{rg}' | project name, type"
      --query "data[].name"
    expect:
      json: { path: "", contains: "{name:id}" }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: resource-graph-rest
    operations: [Microsoft.ResourceGraph Microsoft.ResourceGraph Resources]
    note: The same query without the extension, asking for the object-array format as the CLI does.
    setup:
      - group create --name {rg} --location {location}
      - identity create --name {name:id} --resource-group {rg} --location {location}
    command: >-
      rest --method post --url /providers/Microsoft.ResourceGraph/resources?api-version=2022-10-01
      --body '{"subscriptions": ["{sub}"], "query": "Resources | where resourceGroup =~ \"{rg}\" | project name", "options": {"resultFormat": "objectArray"}}'
    expect:
      json: { path: "data[0].name", equals: "{name:id}" }
    cleanup:
      - group delete --name {rg} --yes --no-wait

  - id: resource-graph-rest-default-format
    operations: [Microsoft.ResourceGraph Microsoft.ResourceGraph Resources]
    note: Without `options`, as the benchmark's P1 arms sent it.
    setup:
      - group create --name {rg} --location {location}
      - identity create --name {name:id} --resource-group {rg} --location {location}
    command: >-
      rest --method post --url /providers/Microsoft.ResourceGraph/resources?api-version=2022-10-01
      --body '{"subscriptions": ["{sub}"], "query": "Resources | where resourceGroup =~ \"{rg}\" | project name"}'
    expect:
      json: { path: "data[0].name", equals: "{name:id}" }
    cleanup:
      - group delete --name {rg} --yes --no-wait
    known_gap:
      reason: >-
        L2: without `options.resultFormat` the emulator answers in the table format
        (`data: {columns, rows}`); since api-version 2021-03-01 Azure's default is objectArray.
        `graph query` asks for objectArray explicitly, so only raw REST callers see it.
      date: 2026-09-27
