        Microsoft.ApiManagement Cache ListByService,
      ]
    setup:
      - group create --name {rg} --location {location}
      - >-
        apim create --name {name:apim} --resource-group {rg} --location {location}
        --publisher-email l2@example.com --publisher-name L2 --sku-name Developer
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ApiManagement/service/{name:apim}/backends/orders-backend?api-version=2024-05-01
        --body '{"properties": {"url": "https://orders.example.com", "protocol": "http"}}'
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ApiManagement/service/{name:apim}/backends/orders-backend?api-version=2024-05-01
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ApiManagement/service/{name:apim}/backends?api-version=2024-05-01
      - run: >-
          monitor app-insights component create --app {name:ai} --resource-group {rg} --location {location}
          --kind web --application-type web --query instrumentationKey -o tsv
        capture: ikey
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ApiManagement/service/{name:apim}/loggers/ai?api-version=2024-05-01
        --body '{"properties": {"loggerType": "applicationInsights", "credentials": {"instrumentationKey": "{ikey}"}}}'
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ApiManagement/service/{name:apim}/loggers/ai?api-version=2024-05-01
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ApiManagement/service/{name:apim}/loggers?api-version=2024-05-01
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ApiManagement/service/{name:apim}/diagnostics/applicationinsights?api-version=2024-05-01
        --body '{"properties": {"loggerId": "/loggers/ai", "alwaysLog": "allErrors"}}'
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ApiManagement/service/{name:apim}/diagnostics/applicationinsights?api-version=2024-05-01
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ApiManagement/service/{name:apim}/diagnostics?api-version=2024-05-01
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ApiManagement/service/{name:apim}/caches/default?api-version=2024-05-01
        --body '{"properties": {"connectionString": "redis-{id}.example.com:6380,password=x,ssl=True", "useFromLocation": "default"}}'
      - >-
        rest --method get
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ApiManagement/service/{name:apim}/caches/default?api-version=2024-05-01
    command: >-
      rest --method get
      --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ApiManagement/service/{name:apim}/caches?api-version=2024-05-01
    expect:
      exitCode: 0
    cleanup:
      - apim delete --name {name:apim} --resource-group {rg} --yes
      - apim deletedservice purge --service-name {name:apim} --location {location}
      - group delete --name {rg} --yes --no-wait

  - id: apim-tags
    operations:
      [
        Microsoft.ApiManagement Tag CreateOrUpdate,
        Microsoft.ApiManagement Tag Get,
        Microsoft.ApiManagement Tag ListByService,
        Microsoft.ApiManagement Tag AssignToApi,
        Microsoft.ApiManagement Tag ListByApi,
        Microsoft.ApiManagement Tag AssignToProduct,
        Microsoft.ApiManagement Tag DetachFromProduct,
        Microsoft.ApiManagement ApiTagDescription ListByService,
      ]
    note: The benchmark's oracles (tapim.py apim-tag-assign-api, apim-tag-detach-product, apim-api-tag-descriptions).
    setup:
      - group create --name {rg} --location {location}
      - >-
        apim create --name {name:apim} --resource-group {rg} --location {location}
        --publisher-email l2@example.com --publisher-name L2 --sku-name Developer
      - apim api create --service-name {name:apim} --resource-group {rg} --api-id orders --path orders --display-name Orders
      - apim product create --service-name {name:apim} --resource-group {rg} --product-id starter --product-name Starter
      - >-
        rest --method put
        --url /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ApiManagement/service/{name:apim}/tags/team-l2?api-version=2024-05-01
        --body '{"properties": {"displayName": "team-l2"}}'
