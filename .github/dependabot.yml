version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # xmcp's runtime inlines its own zod (4.4.x in xmcp 0.6.13) to turn tool
      # schemas into JSON Schema; newer zod schemas break that converter and
      # tools/list fails. Lift this when xmcp ships a matching zod.
      - dependency-name: zod
        update-types:
          - version-update:semver-minor
