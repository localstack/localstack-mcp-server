name: Node.js CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Audit production dependencies
        run: npx audit-ci --high --skip-dev

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: yarn test

      - name: Build the project
        run: yarn build

  mcp-direct-tests:
    # Fork PRs get no secrets, so they skip it; branches in this repo and Dependabot run it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run MCP Server Tester
        run: yarn test:mcp:direct
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

  # Each tool against a real LocalStack, without a model (tests/mcp/tools.spec.mjs). The first
  # test starts LocalStack through the management tool.
  mcp-tool-tests:
    # Fork PRs get no secrets, so they skip it; branches in this repo and Dependabot run it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install the image's tools
        uses: ./.github/actions/host-tools

      # Pulled up front so the start stays within the management tool's 120s.
      - name: Pull the LocalStack image
        run: docker pull localstack/localstack-pro:latest

      - name: Run the tool tests
        run: yarn test:mcp:tools
