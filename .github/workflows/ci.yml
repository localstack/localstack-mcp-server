name: Node.js CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Audit production dependencies
        run: npx audit-ci --high --skip-dev

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: yarn test

      - name: Build the project
        run: yarn build

  mcp-direct-tests:
    runs-on: ubuntu-26.04
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

    steps:
      # GitHub gives pull requests from forks no secrets. Fail loud rather than skip, so a
      # fork PR never looks tested.
      - name: Require the LocalStack auth token
        if: env.LOCALSTACK_AUTH_TOKEN == ''
        run: |
          echo "::error::LOCALSTACK_AUTH_TOKEN is empty. GitHub gives pull requests from forks no secrets: before merging, a maintainer pushes this branch to the repository and opens a pull request from it."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run MCP Server Tester
        run: yarn test:mcp:direct

  # Each tool against a real LocalStack, without a model (tests/mcp/tools.spec.mjs). The first
  # test starts LocalStack through the management tool.
  mcp-tool-tests:
    runs-on: ubuntu-26.04
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      # The nightly image, as in every workflow here: the IAM features under test are on LocalStack's main branch
      # before a release has them. The management tool's start and the port tests launch it.
      LOCALSTACK_IMAGE_NAME: localstack/localstack-pro:dev

    steps:
      # GitHub gives pull requests from forks no secrets. Fail loud rather than skip, so a
      # fork PR never looks tested.
      - name: Require the LocalStack auth token
        if: env.LOCALSTACK_AUTH_TOKEN == ''
        run: |
          echo "::error::LOCALSTACK_AUTH_TOKEN is empty. GitHub gives pull requests from forks no secrets: before merging, a maintainer pushes this branch to the repository and opens a pull request from it."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install the image's tools
        uses: ./.github/actions/host-tools

      # Pulled up front so the start stays within the management tool's 120s.
      - name: Pull the LocalStack image
        run: docker pull "$LOCALSTACK_IMAGE_NAME"

      - name: Run the tool tests
        run: yarn test:mcp:tools
