name: MCP evals

# The LLM-driven eval dataset through OpenRouter, weekly and on demand.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenRouter model ID for every case (empty keeps the dataset's model)"
        required: false
        default: ""
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

# Runs share the Cloud Pod name mcptester-e2e-pod in one LocalStack account, so they must not overlap.
concurrency:
  group: mcp-evals
  cancel-in-progress: false

jobs:
  mcp-evals:
    runs-on: ubuntu-26.04
    # The spec itself times out after 90 minutes; the rest covers setup and the results upload.
    timeout-minutes: 120
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: ${{ inputs.model }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Terraform and uv run at the versions in the Dockerfile's FROM lines, which Dependabot
      # keeps current, so the evals use the same tools as the image.
      - name: Read tool versions from the Dockerfile
        id: versions
        run: |
          terraform=$(sed -nE 's#^FROM hashicorp/terraform:([^ ]+).*#\1#p' Dockerfile)
          uv=$(sed -nE 's#^FROM ghcr\.io/astral-sh/uv:([^ ]+).*#\1#p' Dockerfile)
          # Separate commands: bash -e ignores a failure on the left of &&.
          test -n "$terraform"
          test -n "$uv"
          echo "terraform=$terraform" >> "$GITHUB_OUTPUT"
          echo "uv=$uv" >> "$GITHUB_OUTPUT"

      # The deployer case runs `lstk terraform`; the wrapper would garble its output.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false

      # The tester caps each tool call at the MCP SDK's 60s request timeout, and the deployer
      # runs init, apply and output in one call. Download the AWS provider before the evals.
      - name: Download the sample project's Terraform providers
        run: terraform -chdir=data/sample-terraform init -input=false

      # lstk and the Snowflake CLI come from the same lockfiles as the Docker image.
      - name: Install lstk
        run: |
          npm ci --prefix docker/tools/npm --omit=dev --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/docker/tools/npm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ steps.versions.outputs.uv }}

      - name: Install the Snowflake CLI
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/snowflake-cli
        run: |
          uv sync --project docker/tools/snowflake --locked --no-install-project --no-build
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"

      # Pulled up front so a start inside a case doesn't time out on the download.
      - name: Pull the LocalStack images
        run: |
          docker pull localstack/localstack-pro:latest
          docker pull localstack/snowflake:latest

      - name: Run the eval dataset
        run: yarn test:mcp:evals

      - name: Keep the eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-evals-results
          path: .mcp-test-results
          # The directory starts with a dot, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: ignore
